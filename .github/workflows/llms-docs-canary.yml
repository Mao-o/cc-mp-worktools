name: llms-docs upstream canary

# llms-docs (plugins/llms-docs) はサードパーティの llms.txt / llms-full.txt を
# パースしている。上流のレイアウトが変わってもユニットテストは fixture ベース
# なので気付けない (実例: CHANGELOG の ai-sdk 0 件バグは利用時まで発覚しなかった)。
# このワークフローは一時 cache dir で実際に上流へアクセスし、件数・join rate・
# 代表クエリの hit を実測して異常があれば issue を自動起票する "live smoke" 用。
# 通常の pull_request/push 検証 (validate.yml) とは目的が異なるため別ファイルに分離。

on:
  schedule:
    # validate.yml の週次 canary (毎週月曜 06:00 UTC) と時間帯・曜日をずらし、
    # 上流サイトへのアクセスが同時間帯に重ならないようにする。
    # 注意: public repo の scheduled workflow は default branch でのみ実行され、
    # そのリポジトリで60日間アクティビティが無いと GitHub 側で自動的に無効化される。
    - cron: '0 16 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: llms-docs-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # llms-docs の README 記載どおり 3.11+ 必須 (PEP 604 記法を定義時に評価)。
      # validate.yml のユニットテスト実行と同じ 3.12 に揃える。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 一時 cache dir (runner.temp 配下、job 終了で破棄される) を
      # LLMS_DOCS_CACHE_DIR で指定し、`--max-age 0` で毎回フレッシュな取得を
      # 試みる (README: 既定は $XDG_CACHE_HOME/llms-docs や ~/.cache/llms-docs
      # だが LLMS_DOCS_CACHE_DIR はこの plugin 自身の完全上書き用エスケープ
      # ハッチ)。ただし fetch_url() はライブ取得自体が失敗しても exit させず
      # WARNING を出して同ジョブ内で既に書かれたキャッシュへ黙って fallback する
      # (stale-serve) ため、cache dir を空にするだけでは「常に実際の上流から
      # 取得できた」保証にはならない。parse-firebase.py の一部ページ fetch 失敗
      # (per-page skip) も同様に exit 0 のまま stderr にだけ残る。どちらも
      # code != 0 を経由しないため、下の Python 側は stderr のマーカー文字列
      # (FETCH_FAILURE_MARKERS) を見て1回だけ再試行し、なお残れば FAIL (fetch)
      # 扱いにする (Codex R1 P2)。
      #
      # 閾値は 2026-08-30 に手元で fetch-index/search を実行して実測した値の
      # およそ 50〜70% を下限にしている (実測: code 202 / platform 688 /
      # ai-sdk 571 / firebase 7162 件)。join rate は _common.py
      # check_join_rate() 自体が warn/fail の境界に使っている 0.8 をそのまま
      # 採用 (この値は成長する件数ではなく比率なので実測による再校正は不要)。
      - name: Run live smoke checks against upstream llms.txt sources
        id: smoke
        env:
          LLMS_DOCS_CACHE_DIR: ${{ runner.temp }}/llms-docs-canary-cache
          CANARY_RESULT_PATH: ${{ runner.temp }}/llms-docs-canary-result.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          SCRIPTS = "plugins/llms-docs/scripts"
          PYTHON = sys.executable
          RESULT_PATH = os.environ["CANARY_RESULT_PATH"]


          def run_once(args):
              try:
                  proc = subprocess.run(
                      [PYTHON, *args], capture_output=True, text=True, timeout=60
                  )
                  return proc.returncode, proc.stdout, proc.stderr
              except subprocess.TimeoutExpired as e:
                  return 124, "", f"Error: command timed out after 60s: {e}"
              except OSError as e:
                  return 127, "", f"Error: failed to launch command: {e}"


          def classify_failure(err):
              if "format may have changed" in err or "join rate" in err:
                  return "structural"
              return "fetch"


          # fetch_url() の stale-serve fallback (_common.py _handle_fetch_failure)
          # は "WARNING: fetch failed ..." を、parse-firebase.py の per-page skip
          # (cmd_search / cmd_search_content 内で raise_on_error=True の
          # FetchError を捕捉する経路 — まだキャッシュが無く stale-serve もできない
          # 1ページ分の失敗) は "(skip: fetch failed ..." を、それぞれ exit 0 の
          # まま stderr に残す (Codex R1 P2 #1)。retry の要否判定が `code != 0`
          # だけを見ていると、どちらも再試行されずに素通りする — stale-serve は
          # 再試行なしで即 FAIL (fetch) 化され、firebase の部分的失敗は残り候補に
          # ヒットがあれば threshold FAIL や PASS にすら化けてしまう。
          FETCH_FAILURE_MARKERS = (
              "WARNING: fetch failed",
              "(skip: fetch failed",
          )

          # parse-ai-sdk.py の frontmatter タイトル欠落率チェック
          # (_warn_if_untitled_ratio_high) も exit 0 のまま件数を保持して警告だけ
          # 出す (Codex R1 P2 #2)。他パーサに同種の exit 0 構造警告は無いことを
          # 2026-08-31 にソースで確認済み (parse-claude-docs.py に自前の WARNING
          # は無し、parse-firebase.py の自前 WARNING は --page-ref 省略時の性能
          # 注意のみ)。件数が floor 以上でもこの警告が出ていれば構造的な劣化と
          # して扱う — この文字列は check_join_rate() の 0.5〜0.8 の soft
          # WARNING (_common.py) には含まれないので join-rate+query 側の
          # 既存の "join rate" in err 判定 (kind=threshold) と衝突しない。
          STRUCTURAL_WARNING_MARKERS = (
              "The upstream format may have changed",
          )


          def _any_marker(text, markers):
              return any(m in text for m in markers)


          def run_with_retry(args, label):
              # ネットワークの一時的な失敗 (fetch) だけ1回再試行する。exit 2
              # (assert_parsed / check_join_rate による構造変化・閾値割れ) は
              # 再実行しても同じ結果になる決定論的な失敗なので retry しない。
              # exit 0 のまま FETCH_FAILURE_MARKERS が stderr に残るケース
              # (stale-serve / firebase per-page skip) も同じ理由で1回だけ
              # 再試行の対象に含める。STRUCTURAL_WARNING_MARKERS は exit 0 でも
              # 再試行しない (真の上流フォーマット変化なら再試行しても同じ結果)。
              code, out, err = run_once(args)
              if code != 0:
                  should_retry = classify_failure(err) == "fetch"
                  reason = f"first attempt failed (exit {code})"
              else:
                  should_retry = _any_marker(err, FETCH_FAILURE_MARKERS)
                  reason = "first attempt exited 0 but left a fetch-failure marker on stderr"
              if should_retry:
                  print(f"[{label}] {reason}; retrying once in 10s...", file=sys.stderr)
                  time.sleep(10)
                  code, out, err = run_once(args)
              return code, out, err


          def check_output_markers(err):
              # run_with_retry() が返す最終 (再試行があればその後の) stderr を
              # 検査する。各 extract() の冒頭、件数・hit 数の閾値判定より前に
              # 呼び、「今回のライブ取得・解析がそもそも信頼できるか」を先に
              # 確定させる。両方のマーカーが同時に出ていても structural を優先
              # する (classify_failure() と同じ優先順位: 再試行不能な劣化を
              # 見逃さないため)。
              if _any_marker(err, STRUCTURAL_WARNING_MARKERS):
                  return False, f"parser reported a structural warning on stderr: {err.strip()[-300:]}", "structural"
              if _any_marker(err, FETCH_FAILURE_MARKERS):
                  return False, f"fetch failure marker still present after retry: {err.strip()[-300:]}", "fetch"
              return None


          checks = []


          def record(name, ok, detail, kind=None):
              checks.append({"name": name, "ok": ok, "kind": kind, "detail": detail})
              marker = "notice" if ok else "error"
              status = "PASS" if ok else f"FAIL ({kind})"
              print(f"::{marker}::[{name}] {status}: {detail}")


          def run_check(name, args, extract):
              try:
                  code, out, err = run_with_retry(args, name)
                  if code != 0:
                      record(name, False, f"command failed after retry (exit {code}): {err.strip()[-300:]}", classify_failure(err))
                      return
                  ok, detail, kind = extract(out, err)
                  record(name, ok, detail, kind)
              except Exception as e:  # noqa: BLE001 - a bug here must not crash the whole canary
                  record(name, False, f"canary script raised {type(e).__name__}: {e}", "structural")


          # entries >= floor (fetch-index; live-fetches the lightweight llms.txt index)
          ENTRIES_CHECKS = [
              ("code entries", [f"{SCRIPTS}/parse-claude-docs.py", "fetch-index", "--source", "code", "--max-age", "0"],
               re.compile(r"\((\d+) pages total"), 120),
              ("platform entries", [f"{SCRIPTS}/parse-claude-docs.py", "fetch-index", "--source", "platform", "--max-age", "0"],
               re.compile(r"\((\d+) pages total"), 400),
              ("ai-sdk entries", [f"{SCRIPTS}/parse-ai-sdk.py", "fetch-index", "--max-age", "0"],
               re.compile(r"\((\d+) documents total"), 400),
              ("firebase entries", [f"{SCRIPTS}/parse-firebase.py", "fetch-index", "--max-age", "0", "--limit", "1"],
               re.compile(r"of (\d+) pages shown"), 5000),
          ]

          for name, args, pattern, floor in ENTRIES_CHECKS:
              def extract(out, err, pattern=pattern, floor=floor):
                  marker = check_output_markers(err)
                  if marker is not None:
                      return marker
                  m = pattern.search(out)
                  if not m:
                      return False, f"expected count pattern {pattern.pattern!r} not found in output", "structural"
                  n = int(m.group(1))
                  ok = n >= floor
                  return ok, f"{n} entries (floor {floor})", (None if ok else "threshold")
              run_check(name, args, extract)

          # code/platform: index<->full-text join rate >= 0.8 (only claude-docs
          # joins two separate upstream files; ai-sdk/firebase have no such join).
          # `search` is the only subcommand that exercises check_join_rate(), and
          # it prints a WARNING (0.5-0.8) or a hard Error+exit 2 (<0.5) when the
          # ratio is unhealthy - checked below via stderr for both sources. For
          # code, the same call's stdout doubles as the representative-query
          # ("hooks") hit check. platform has no representative-query floor in
          # the ticket, so instead of trusting "no join-rate message" alone
          # (proven vacuous by a fixture: healthy join rate + zero actual search
          # results still prints nothing to stderr), it also positively asserts
          # search's own "(N pages from ...)" summary line has N >= 1.
          JOIN_QUERY = "hooks"
          for source, floor_hits in (("code", 1), ("platform", None)):
              name = f"{source} join-rate+query"
              args = [f"{SCRIPTS}/parse-claude-docs.py", "search", JOIN_QUERY, "--source", source, "--max-age", "0"]

              def extract(out, err, floor_hits=floor_hits):
                  marker = check_output_markers(err)
                  if marker is not None:
                      return marker
                  if "join rate" in err:
                      return False, f"join-rate warning/error below the 0.8 floor: {err.strip()}", "threshold"
                  if floor_hits is not None:
                      hits = sum(int(x) for x in re.findall(r"\((\d+) body hits, showing", out))
                      ok = hits >= floor_hits
                      return ok, f"join rate healthy; {hits} body hits for {JOIN_QUERY!r} (floor {floor_hits})", (None if ok else "threshold")
                  pages = sum(int(x) for x in re.findall(r"\((\d+) pages from ", out))
                  ok = pages >= 1
                  return ok, f"join rate healthy; {pages} pages found for {JOIN_QUERY!r} (floor 1)", (None if ok else "threshold")
              run_check(name, args, extract)

          # representative query hit >= 1 (ai-sdk / firebase; code's "hooks" is
          # already covered by the join-rate+query check above)
          QUERY_CHECKS = [
              ("ai-sdk streamText hit", [f"{SCRIPTS}/parse-ai-sdk.py", "search", "streamText", "--max-age", "0"]),
              ("firebase Firestore hit", [f"{SCRIPTS}/parse-firebase.py", "search", "Firestore", "--top-n", "3", "--max-age", "0"]),
          ]
          for name, args in QUERY_CHECKS:
              def extract(out, err):
                  marker = check_output_markers(err)
                  if marker is not None:
                      return marker
                  hits = sum(int(x) for x in re.findall(r"\((\d+) body hits, showing", out))
                  ok = hits >= 1
                  return ok, f"{hits} body hits (floor 1)", (None if ok else "threshold")
              run_check(name, args, extract)

          failed = [c for c in checks if not c["ok"]]
          summary_lines = ["| Check | Result | Detail |", "|---|---|---|"]
          for c in checks:
              result = "PASS" if c["ok"] else f"FAIL ({c['kind']})"
              detail = c["detail"].replace("|", "\\|").replace("\n", " ")
              summary_lines.append(f"| {c['name']} | {result} | {detail} |")

          with open(RESULT_PATH, "w") as f:
              json.dump({"checks": checks, "failed": len(failed) > 0}, f, indent=2)

          print("\n".join(summary_lines))

          if failed:
              print(f"\n{len(failed)} check(s) failed.", file=sys.stderr)
              sys.exit(1)
          print("\nAll checks passed.")
          PY

      # 直前 (id: smoke) の live smoke checks ステップが失敗した場合のみ実行
      # (checkout/setup-python 等、smoke より前の失敗では起票しない — その場合
      # steps.smoke.outcome は未設定で 'failure' と一致しない)。`failure() &&`
      # を落とすと暗黙の success() 判定でこのステップ自体が skip されるため
      # 必ず両方書く。タイトルは失敗の内訳 (すべて fetch 由来かどうか) で分け、
      # それぞれ独立に同じタイトルの open issue へ重複排除する (毎週重複起票
      # しないため)。
      - name: Report failures as a tracking issue
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_RESULT_PATH: ${{ runner.temp }}/llms-docs-canary-result.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          RESULT_PATH = os.environ["CANARY_RESULT_PATH"]
          TITLE_DRIFT = "llms-docs canary: upstream llms.txt drift detected"
          TITLE_FETCH = "llms-docs canary: upstream fetch failures (transient?)"

          server_url = os.environ.get("GITHUB_SERVER_URL", "")
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}"

          try:
              with open(RESULT_PATH) as f:
                  data = json.load(f)
              checks = data.get("checks", [])
          except (OSError, ValueError):
              checks = None

          if not checks:
              # No per-check data to classify by (the check step crashed before
              # recording anything) - that's itself worth surfacing loudly
              # rather than filing it as "probably transient".
              TITLE = TITLE_DRIFT
              body = (
                  "Weekly live smoke test for llms-docs upstream sources did not "
                  "produce a normal result (the check step likely crashed before "
                  "recording individual checks).\n\n"
                  f"See the run log for details: {run_url}"
              )
          else:
              failed_checks = [c for c in checks if not c.get("ok")]
              # Only use the softer "transient?" title when every failure is a
              # fetch-layer failure; any structural/threshold failure mixed in
              # falls back to the drift title (and so does an empty
              # failed_checks, which this step reaching this point shouldn't
              # produce now that it only runs on an actual smoke-step failure).
              TITLE = TITLE_FETCH if failed_checks and all(
                  c.get("kind") == "fetch" for c in failed_checks
              ) else TITLE_DRIFT
              lines = [
                  "Weekly live smoke test detected a problem with one or more "
                  "llms-docs upstream sources (`.github/workflows/llms-docs-canary.yml`).",
                  "",
                  "| Check | Result | Detail |",
                  "|---|---|---|",
              ]
              for c in checks:
                  result = "PASS" if c.get("ok") else f"FAIL ({c.get('kind') or 'unknown'})"
                  detail = str(c.get("detail", "")).replace("|", "\\|").replace("\n", " ")
                  lines.append(f"| {c.get('name')} | {result} | {detail} |")
              lines += ["", f"Run: {run_url}"]
              body = "\n".join(lines)

          body_path = os.path.join(os.environ["RUNNER_TEMP"], "llms-docs-canary-issue-body.md")
          with open(body_path, "w") as f:
              f.write(body)

          list_proc = subprocess.run(
              ["gh", "issue", "list", "--repo", repo, "--state", "open", "--json", "number,title", "--limit", "100"],
              capture_output=True, text=True,
          )
          if list_proc.returncode != 0:
              print(f"WARNING: gh issue list failed (exit {list_proc.returncode}): {list_proc.stderr}", file=sys.stderr)
              existing = []
          else:
              try:
                  existing = json.loads(list_proc.stdout or "[]")
              except ValueError as e:
                  print(f"WARNING: gh issue list returned unparseable JSON ({e}); treating as no existing issue", file=sys.stderr)
                  existing = []

          match = next((i for i in existing if i.get("title") == TITLE), None)

          if match:
              number = str(match["number"])
              print(f"Existing open issue #{number} found; appending a comment.")
              subprocess.run(
                  ["gh", "issue", "comment", number, "--repo", repo, "--body-file", body_path],
                  check=True,
              )
          else:
              print("No existing open issue found; creating a new one.")
              subprocess.run(
                  ["gh", "issue", "create", "--repo", repo, "--title", TITLE, "--body-file", body_path],
                  check=True,
              )
          PY
