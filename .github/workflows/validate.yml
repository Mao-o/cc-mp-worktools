name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 毎週月曜 06:00 UTC に @latest の Claude Code CLI で canary 検証する。
    # CLI の schema 受理範囲/挙動は version で変わりうるため、乖離を早期検知する。
    - cron: '0 6 * * 1'
  workflow_dispatch:

# 既定は read-only。書き込みが必要なのは tag-plugin-releases job だけなので、
# そこに限って job 単位で contents: write を与える。
permissions:
  contents: read

jobs:
  validate:
    # 週次 schedule は canary (validate-latest-canary) 専用。pull_request/push/
    # workflow_dispatch では常に固定版で本チェックを実行する。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # この job で Python を使うのは scripts/check_*.py (整合性チェック) だけで、
      # どちらも標準ライブラリのみ・バージョン依存なし。repo の宣言下限が 3.11 な
      # ので、そこを満たす版を 1 つ固定すれば足りる (3.12 を据え置き)。
      # plugin の unittest を複数バージョンで回すのは tests job (matrix) の担当。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CLI の schema 受理範囲は version で変わりうる (2.1.101→2.1.175 の実例あり)。
      # 固定版にすることで、同一 commit でも実行日次第で pass/fail が変わる揺れを
      # 無くす。乖離の早期検知は validate-latest-canary job (週次 schedule /
      # workflow_dispatch) が別途担当する。bump は Dependabot/Renovate 等の npm
      # 更新 PR に任せる。
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.251

      - name: Show Claude Code version
        run: claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate each plugin
        run: |
          set -e
          for dir in plugins/*/; do
            [ -d "$dir" ] || continue
            echo "== Validating $dir =="
            claude plugin validate "$dir"
          done

      # Codex 向け .codex-plugin/plugin.json を持つ plugin (現状 session-facts の
      # み) の version が Claude 向け plugin.json と一致しているか検証する。
      # 対象 plugin が無くても fail しない。
      - name: Check Codex manifest version consistency
        run: python3 scripts/check_codex_manifest_version.py

      # marketplace entry の description / keywords は plugin.json と二重に持つしか
      # ない (install 前の一覧は entry の値だけを見ており、省いても plugin.json へ
      # fallback しない)。二重に持つ以上ドリフトするので CI で突合する。
      - name: Check marketplace entry / plugin.json sync
        run: python3 scripts/check_marketplace_entry_sync.py

  lint:
    # ruff (E/F/W) の静的検査。設定は root の pyproject.toml に置いてあり、
    # ローカルでも `make lint` で同じ結果が出る。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ruff は version ごとに規則が追加・強化されるため固定する (claude CLI と
      # 同じ理由: 同一 commit でも実行日次第で pass/fail が変わる揺れを避ける)。
      # pyproject.toml の ignore 一覧はこの版での違反件数を前提にしている。
      - name: Install ruff (pinned)
        run: pip install 'ruff==0.16.8'

      - name: Show ruff version
        run: ruff --version

      - name: Lint
        run: ruff check .

  tests:
    # 各 plugin の unittest を複数の Python バージョンで回す。
    #
    # 以前ここは validate job の中の 1 ステップで、3.12 固定の理由を「各 plugin の
    # unittest が tomllib (3.11+) を使うため」と書いていたが、これは実態と違った:
    # tomllib を使うのは sensitive-files-guardrail の
    # hooks/redact-sensitive-reads/redaction/tomllike.py の **optional import** だけ
    # で、未搭載時は ImportError を捕まえて「未対応」として扱い、テスト側も
    # tomllib の成功パスを skip する。つまり tomllib は下限を決めていない。
    #
    # 実際の下限は repo の宣言方針 (README / CONTRIBUTING の "Python 3.11+"。
    # 3.9 / 3.10 互換 shim は追加しない) で決まる。よって matrix は
    #   3.11 = 宣言している下限 (ここが落ちたら README が嘘になる)
    #   3.12 = これまで CI が唯一実行していた版 (退行の基準)
    #   3.13 = 現行の新しい安定版 (先行して壊れを拾う)
    # とする。3.11 / 3.12 / 3.13 の 10 suite が green であることはローカルで実測済み。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # 1 バージョンが落ちても残りの結果を出す (「3.11 だけ落ちた」のか
      # 「全バージョンで落ちた」のかを 1 回の run で判別したいため)。
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 列挙ロジックは scripts/test-all.sh に一本化してあり、ローカルでも
      # 同じコマンドで再現できる (`scripts/test-all.sh` または `make test`)。
      # setup-python が PATH 先頭に置く python3 をそのまま使う。
      - name: Run plugin unit tests
        run: scripts/test-all.sh

  tests-windows:
    # sensitive-files-guardrail の 2 suite だけを Windows で回す job。
    #
    # 背景: 0.34.0 で「SIGALRM が無い環境では全 tool 呼出を deny」という実質
    # Windows 無効化ゲートを撤去し、非 UNIX でも通常のパイプラインを通すように
    # した。一方で CI は ubuntu-latest しか回しておらず、plugin の README も
    # 「Windows は未検証」と明記したままになっている。
    #
    # **この job の目的は「Windows で落ちるテストを洗い出す」こと**であって、
    # 最初から green にすることではない (内部バックログ)。落ちたケースは
    # 「Windows では skip」にせず、挙動を確定させてから README の「未検証」を
    # 更新する。そのため continue-on-error は付けない (赤を隠さない)。
    #
    # 既存 tests job (ubuntu matrix) には手を入れない。あちらは
    # scripts/test-all.sh (bash + find) で全 plugin を列挙する作りで、同じ
    # 列挙を Windows に通すとスクリプトの移植が本題より大きくなる。ここで
    # 知りたいのは「SFG の 2 suite が Windows でどう落ちるか」の 1 点なので、
    # 各 suite の package root で unittest discover を直接呼ぶ (test-all.sh が
    # 各 suite に対して行うのと同じ呼び方)。
    # 当面は赤である前提の調査用なので、pull_request / push のゲートには載せない
    # (green 化は複数 PR にまたがる見込みで、その間ずっと無関係な PR にも赤が
    # 2 本出続けるため)。手動起動 (workflow_dispatch) でだけ回す。Windows が
    # 安定して green になったら、この job は畳んで tests job の matrix に
    # windows-latest を足す形へ統合する。continue-on-error は付けない (赤を隠さない)。
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # 片方が落ちてももう片方を最後まで走らせる。目的が失敗の洗い出しなので、
      # 1 回の run で両 suite 分の失敗一覧が欲しい (ubuntu 側 matrix と同趣旨)。
      fail-fast: false
      matrix:
        suite: [check-sensitive-files, redact-sensitive-reads]
    steps:
      # GH の Windows runner は Git for Windows 既定で core.autocrlf=true。この repo に
      # .gitattributes は無いため、放置すると tests/fixtures/** が CRLF で展開され、
      # 「Windows のランタイム差」ではなく「checkout 設定」由来の失敗が洗い出し結果に
      # 混ざる。母集団を LF に固定してから測る。
      - name: Pin line endings to LF before checkout
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      # 実際にどう展開されたかを毎 run 一次情報として残す。
      - name: Show line-ending config
        run: git config --get core.autocrlf

      # Python は 1 バージョンで足りる。この job で見たいのは **プラットフォーム
      # 差** (symlink 作成権限 / O_NOFOLLOW の有無 / パス区切り / Path.home() の
      # 解決元 / 改行変換) であって、バージョン差は ubuntu 側の matrix
      # (3.11 / 3.12 / 3.13) が既に見ている。2 軸を掛けると失敗の切り分けが
      # 「OS のせいか version のせいか」で曖昧になるため、OS 軸だけを足す。
      # 3.12 を選ぶのは他の job (validate / lint) と揃えるため。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Windows runner の既定 shell は pwsh。shell 依存を持ち込まないよう、
      # ステップは単一コマンド + working-directory だけで構成する。
      # `python3` ではなく `python` を使う: setup-python が Windows で PATH に
      # 置くのは `python` で、`python3` があるとは限らない (あっても Microsoft
      # Store の shim を掴む可能性がある)。
      - name: Run ${{ matrix.suite }} unit tests
        working-directory: plugins/sensitive-files-guardrail/hooks/${{ matrix.suite }}
        run: python -m unittest discover tests

  tag-plugin-releases:
    # main へ入った commit に対して、各 plugin の plugin.json の version に対応する
    # リリース tag (<plugin>/v<version>) が無ければ annotated tag を作って push する。
    #
    # validate / lint / tests が green のときだけ打つ (壊れた commit に version を
    # 指す tag を残さないため)。落ちた場合は tag が作られないだけなので、次に
    # green な push が来た時点で同じ tag が作られる (version は変わらないため)。
    #
    # tests-windows は **意図的に needs へ入れない**。あの job は「Windows で
    # 落ちるテストを洗い出す」ための調査用で、当面は赤であることが前提
    # (workflow_dispatch 限定で push では走らない)。needs に入れると
    # 「走っていない job を待つ」形になり、全 plugin のリリース tag が止まる。Windows が安定して green になり、plugin 側の
    # 「Windows は未検証」表記を外せた時点で needs への追加を検討する。
    #
    # GITHUB_TOKEN による tag push は他の workflow を起動しない (GitHub の仕様) ので、
    # この job が自分自身を再帰的に呼ぶことはない。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-plugin-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          # 既存 tag の有無をローカルで判定するため、全履歴と全 tag を取得する
          # (浅い clone だと tag が来ず、既存 tag を作り直そうとして push が
          # reject される)。
          fetch-depth: 0

      # annotated tag には committer identity が必要で、Actions の既定では未設定。
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # 判定・列挙ロジックはスクリプト側に一本化してある (規約導入時の遡及付与と
      # 通常運用で同じコードを使うため)。既定は dry-run なので --apply が必要。
      - name: Create and push missing plugin release tags
        run: scripts/backfill-plugin-tags.sh --apply

  validate-latest-canary:
    # @latest で claude plugin validate の挙動変化を早期検知する canary job。
    # 週次 schedule、または手動の workflow_dispatch でのみ実行する。
    #
    # continue-on-error は schedule 以外でだけ有効にする。schedule では本 job が
    # 唯一の job になるため、常に許容すると CLI 非互換を検出しても run が green の
    # まま通知が飛ばず、canary の目的が成立しない。手動起動時は固定版の validate と
    # 併走するので、canary の red で run 全体を落とさない。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code (latest)
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Show Claude Code version
        run: claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate each plugin
        run: |
          set -e
          for dir in plugins/*/; do
            [ -d "$dir" ] || continue
            echo "== Validating $dir =="
            claude plugin validate "$dir"
          done
