<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>判断待ち</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
  --control-line: #85827a;   /* 操作部品 (選択肢・補足欄) の枠。背景に対して 3:1 以上 (--line は区切り線用) */
  --accent: #2f5fd0; --accent-ink: #ffffff; --accent-soft: #e8eefc;
  --d1-fg: #ffffff; --d1-bg: #3a3a36; --d1-bd: #3a3a36;
  --d2-fg: #8a3d00; --d2-bg: #fff4e5; --d2-bd: #b45f06;
  --d3-fg: #5b3d99; --d3-bg: #f1ebfb; --d3-bd: #7a5bc0;
  --d4-fg: #55544e; --d4-bg: #f0efea; --d4-bd: #77766f;
  --rec: #1f7a4d; --rec-soft: #e3f3ea; --warn: #b4441f; --p0: #b4441f; --p1: #a85a0a; --p2: #4b6bb5; --p3: #6b6a64;
  --toast-bg: #ffffff; --toast-line: #d3d0c6; --toast-shadow: rgba(0, 0, 0, .18);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --panel: #201f1c; --ink: #ecebe6; --muted: #9c9a92; --line: #34322d;
    --control-line: #76736a;
    --accent: #7c9cf0; --accent-ink: #10131c; --accent-soft: #252c40;
    --d1-fg: #161614; --d1-bg: #ecebe6; --d1-bd: #ecebe6;
    --d2-fg: #f2b36b; --d2-bg: #3a2a17; --d2-bd: #c98a3f;
    --d3-fg: #c8b0f5; --d3-bg: #2f2644; --d3-bd: #9a7ee0;
    --d4-fg: #b5b3aa; --d4-bg: #2c2b27; --d4-bd: #8c8a82;
    --rec: #5cc28f; --rec-soft: #1c3127; --warn: #ec8a66; --p0: #ec8a66; --p1: #e7a65a; --p2: #8ea6e6; --p3: #9c9a92;
    --toast-bg: #3a3833; --toast-line: #5a574f; --toast-shadow: rgba(0, 0, 0, .6);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 860px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.bar h1 { font-size: 18px; margin: 0; }
.bar .count { font-size: 18px; font-weight: 700; color: var(--accent); }
.bar .meta { color: var(--muted); font-size: 13px; margin-left: auto; }
.bar button { font-size: 13px; }
#notice { background: var(--panel); border-bottom: 2px solid var(--warn); }
#notice .inner { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--warn); font-weight: 600; }
#notice button { font-size: 13px; }
/* プロジェクトの目次の帯 (ヘッダーの下。sticky にはしない)。1 行目に並びの切り替え (プロジェクトごと / 全体を優先度順)、その下にチップ。
   チップは「名前 + 判断待ちの件数」で、判断待ちに P0 があれば P0 の印を付ける。全体の表示ではチップを出さない (飛ぶ先の見出しが無い)。
   切り替えをチップの横に置くと、チップの行の幅が切り替えの幅だけ削られ (半端な px になり)、長い名前のチップの幅と合わなくなるので、行を分ける。
   幅 640px 以下はチップを 1 行にして帯の中だけ横にスクロールさせる (ページ全体は横にスクロールさせない) */
#toc .inner { max-width: 860px; margin: 0 auto; padding: 10px 16px 2px; display: flex; flex-direction: column; gap: 6px; }
#tocin { min-width: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
#tocin:empty { display: none; }
.view { display: flex; }
.viewbtn { font: inherit; font-size: 13px; line-height: 1.6; padding: 2px 12px; background: var(--panel); color: var(--ink);
  border: 1px solid var(--control-line); cursor: pointer; }
.viewbtn:first-child { border-radius: 999px 0 0 999px; }
.viewbtn:last-child { border-radius: 0 999px 999px 0; border-left: 0; }
.viewbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.viewbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tocchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font: inherit; font-size: 13px; line-height: 1.6; cursor: pointer; }
.tocchip:hover { border-color: var(--accent); }
.tocname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tocn { flex: none; font-weight: 700; color: var(--accent); }
.tocp0 { flex: none; font-size: 11px; font-weight: 700; color: var(--p0); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; line-height: 1.5; }
/* チップは縮まない (overflow が visible の flex item の min-width は中身の幅。max-width: 100% で帯の幅までに抑え、長い名前は … で切る) */
@media (max-width: 640px) {
  #tocin { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
}
/* 絞り込みと検索の帯 (目次の帯の下。sticky にはしない)。操作部品は選べる値が 2 つ以上あるときだけ出す */
#filters .inner { max-width: 860px; margin: 0 auto; padding: 10px 16px 2px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
.fld { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.fld[hidden] { display: none; }
.fld input, .fld select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--control-line); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
.fld input { width: 240px; }
.fld select { max-width: 220px; }
.fcount { font-size: 13px; color: var(--muted); padding-bottom: 5px; }
#fclear { font-size: 13px; padding: 3px 12px; }
#fclear[hidden] { display: none; }
@media (max-width: 640px) { .fld.fsearch { flex: 1 1 100%; } .fld.fsearch input { width: 100%; } }
main { max-width: 860px; margin: 0 auto; padding: 8px 16px 64px; }
/* タブ (判断待ち / 見通し)。ヘッダーの下 (sticky にはしない)。既定は判断待ち (開くたびに判断待ち。選んだタブは覚えない) */
#tabs .inner { max-width: 860px; margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-size: 14px; line-height: 1.6; padding: 4px 14px; margin-bottom: -1px; background: none; color: var(--muted);
  border: 0; border-bottom: 3px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* 見通し (読むだけ。書き込みの部品は置かない。ボタンも置かず、移るのはリンク) */
.ov { max-width: 860px; margin: 0 auto; padding: 8px 16px 64px; }
.ovtop { margin: 12px 0 0; font-size: 15px; }
.ovtop b { color: var(--accent); }
.ovnote { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.ov a { color: var(--accent); }
.ov a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ovstat { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.ovstat li { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 13px; }
.ovstat .ovs { font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
.ovready { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 8px; }
.ovrow { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; min-width: 0; }
.ovrow .ovt { margin: 4px 0 0; overflow-wrap: anywhere; }
.ovid { font-family: ui-monospace, Menlo, monospace; }
.ovrow .head > span { min-width: 0; overflow-wrap: anywhere; }   /* 長い ID・ラベルで、幅の狭い画面のページを横にスクロールさせない */
.ovhuman { font-weight: 700; color: var(--accent); }
.ovnone { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
h3, h2.sec { font-size: 14px; color: var(--muted); font-weight: 600; margin: 28px 0 10px; letter-spacing: .02em; }
/* 全体を優先度順の表示の節の見出し (判断待ち / 回答済み・反映待ち)。プロジェクトの見出しが無いので h2 にし、見た目は節の見出し (h3) と同じ。止めない */
h2.sec { display: block; position: static; padding: 0; line-height: inherit; background: none; z-index: auto; }
/* カードの scroll-margin-top: sticky のヘッダー (--head-h。JS が測る) と、止まったプロジェクトの見出し (h2。1 行で約 36px) の下に 10px 空ける。
   フォーカスが移ったカード (moveFocusAway) の上端が、止まった見出しの下に隠れないように */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; scroll-margin-top: calc(var(--head-h, 64px) + 46px); }
.card.failed { border-color: var(--warn); }
/* カード自身は tabindex="-1" で、畳んだカードの次にフォーカスを受ける (中のボタンには渡さない)。目印は枠だけにする */
.card:focus { outline: none; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.prio { font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
/* プロジェクトの見出しは、スクロールしても sticky のヘッダーの下 (--head-h) に止まる (今見ているカードのプロジェクトが分かる)。
   止まったときに下のカードを隠しすぎないよう 1 行 (約 36px) に収め、名前とパスは溢れたら … で切る (パスを先に縮める。
   overflow: hidden の flex item は min-width が 0 に決まるので、min-width は書かない)。
   z-index は、動いている (transform・opacity の付いた) カードより上に描くため */
h2 { font-size: 16px; line-height: 26px; margin: 26px 0 0; padding: 4px 0; display: flex; gap: 10px; align-items: baseline;
  position: sticky; top: var(--head-h, 0px); z-index: 1; background: var(--bg); }
h2:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
h2 .pname { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
h2 .path { flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12px; color: var(--muted); font-weight: 400; font-family: ui-monospace, Menlo, monospace; }
/* 目次のチップで飛ぶ先は .proj (見出しの入れ物) で、その上端をヘッダーの下に合わせる。余白が無いと入れ物の上端が画面の上端に来て、
   見出しは止まってヘッダーの下に出るが、その下の節の見出しと最初のカードの上がヘッダーと見出しの下に隠れる */
.proj { scroll-margin-top: var(--head-h, 0px); }
.prio.p0 { color: var(--p0); } .prio.p1 { color: var(--p1); } .prio.p2 { color: var(--p2); } .prio.p3, .prio.p4 { color: var(--p3); }
/* カードの head のプロジェクト名。全体の表示の入れ物 (.flat) の中のカードにだけ出す (プロジェクトごとの表示では見出しに出ている) */
.head .pj { display: none; font-weight: 700; color: var(--ink); max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flat .head .pj { display: block; }
button.id { font-family: ui-monospace, Menlo, monospace; font-size: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
.copied { color: var(--rec); font-weight: 600; }
.copied:empty { display: none; }
.title { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.ask { font-size: 17px; font-weight: 700; margin: 10px 0 6px; }
.ctx { margin: 0 0 12px; white-space: pre-wrap; }
.ctxbox { margin: 0 0 12px; }
.ctxbox .ctx { margin: 0; }
.ctxbox .ctx.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; line-clamp: 5; overflow: hidden; }
button.ctxmore { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; padding: 2px 0; cursor: pointer; }
button.ctxmore[hidden] { display: none; }
.opts { display: grid; gap: 8px; margin: 10px 0; }
.opt { text-align: left; background: var(--panel); color: var(--ink); border: 1.5px solid var(--control-line);
  border-radius: 8px; padding: 10px 12px; cursor: pointer; font: inherit; }
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt .l { font-weight: 700; }
.opt .d { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.opt.rec { border-left: 4px solid var(--rec); }
/* 書き込めないプロジェクトの選択肢 (押せない一覧) と、回答の部品の代わりの案内 */
.roopts { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
.roopts li { padding: 6px 12px; border-left: 3px solid var(--line); }
.roopts li.rec { border-left-color: var(--rec); }
.roopts .l { font-weight: 700; }
.roopts .d { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.ro { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 700; color: var(--rec); background: var(--rec-soft); padding: 1px 7px; border-radius: 999px; margin-right: 6px; }
/* 対処の深さのチップ。推奨の緑 (--rec) とは混ぜない: 根本は中立の濃色、ほかは橙・紫・灰 */
.depth { font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 4px; margin-right: 6px; border: 1.5px solid; white-space: nowrap; }
.depth-根本 { color: var(--d1-fg); background: var(--d1-bg); border-color: var(--d1-bd); }
.depth-応急 { color: var(--d2-fg); background: var(--d2-bg); border-color: var(--d2-bd); }
.depth-調査 { color: var(--d3-fg); background: var(--d3-bg); border-color: var(--d3-bd); }
.depth-見送り { color: var(--d4-fg); background: var(--d4-bg); border-color: var(--d4-bd); }
textarea { width: 100%; min-height: 58px; resize: vertical; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--control-line); border-radius: 8px; padding: 8px 10px; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 18px; font: inherit; font-weight: 700; cursor: pointer; }
button.primary:disabled { opacity: .45; cursor: default; }
.keyhint { font-size: 12px; color: var(--muted); }
button.ghost { background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
.err { color: var(--warn); font-size: 13px; overflow-wrap: anywhere; min-width: 0; }
.errbox { margin-top: 8px; }
.errbox:empty { display: none; }
.errbox details { margin-top: 0; }
.errbox summary.err { cursor: pointer; }
.errbox pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 ui-monospace, Menlo, monospace; background: var(--bg);
  border-radius: 8px; padding: 8px 10px; margin: 6px 0 0; max-height: 220px; overflow: auto; }
details { margin-top: 12px; }
summary { color: var(--muted); font-size: 13px; cursor: pointer; }
.md code { font: .92em ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
details pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.6 ui-monospace, Menlo, monospace; background: var(--bg);
  border-radius: 8px; padding: 10px 12px; margin: 8px 0 0; max-height: 420px; overflow: auto; }
.ans { white-space: pre-wrap; margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; }
/* 保留: 判断待ちのカードの「保留」で開く欄 (期間の選択・日付・補足・「保留する」)。押した期間は aria-pressed で示す。
   欄のボタンは .row の外に置く (.row のボタンはトーストと重ならない位置に並べる約束で、「回答する」と「保留」だけを置く) */
.snzbox { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); display: grid; gap: 8px; }
.snzbox[hidden] { display: none; }
.snzopts { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.snzopt { font: inherit; font-size: 13px; line-height: 1.6; padding: 2px 12px; border-radius: 999px; border: 1px solid var(--control-line);
  background: var(--panel); color: var(--ink); cursor: pointer; }
.snzopt[aria-pressed="true"], .snzdate.sel input { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.snzdate, .snzlead { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.snzdate input, input.snznote { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--control-line);
  border-radius: 8px; padding: 2px 8px; }
input.snznote { width: 100%; }
.snzrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button.snzgo { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 6px 16px; font: inherit; font-weight: 700; cursor: pointer; }
button.snzgo:disabled { opacity: .45; cursor: default; }
.snzinfo { margin: 8px 0 0; font-size: 14px; font-weight: 600; }
.snznotetext, .snzback { margin: 6px 0 0; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.snzback { margin: 8px 0 0; padding-left: 10px; border-left: 3px solid var(--control-line); }
/* 保留中の節 (ページの下。既定は畳む) と、回答済み・反映待ちの節 (各プロジェクトの下・全体の表示の下。既定は畳む)。
   見出し (保留中と全体の表示は h2.sec、プロジェクトごとの表示の回答済みは h3) は節の見出しと同じ見た目で、summary の行に収める。
   子孫ではなく子の結合子で書く: 節の中のカードも details (チケット本文・失敗の全文) を持つ */
details.snz, details.ansgrp { margin-top: 28px; }
details.snz > summary, details.ansgrp > summary { font-size: 14px; }
details.snz > summary h2.sec, details.ansgrp > summary h2.sec, details.ansgrp > summary h3 { display: inline; margin: 0; }
details.snz[open] > summary, details.ansgrp[open] > summary { margin-bottom: 10px; }
/* 回答の後のフォーカスは、見えるカードが他に無いとき、畳んだ節の summary へ移る (moveFocusAway) */
details.snz > summary:focus-visible, details.ansgrp > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 畳んだままでも、中に取り消しの失敗で戻ったカードがあると分かるよう、見出しの行に失敗の件数を出して警告の色にする (syncAnsHead)。保留中の節も同じ (syncSnzHead) */
details.ansgrp > summary.hasfail, details.ansgrp > summary.hasfail h2.sec, details.ansgrp > summary.hasfail h3,
details.snz > summary.hasfail, details.snz > summary.hasfail h2.sec { color: var(--warn); }
.snz .head .pj { display: block; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.banner { background: var(--panel); border: 1px solid var(--warn); color: var(--warn); border-radius: var(--radius); padding: 10px 14px; margin-top: 14px; overflow-wrap: anywhere; }
/* 消える: 高さを畳みながら薄くして横へ。現れる: 高さを 0 から広げながら上から下りてくる。
   畳みかけのカードが戻るときは、同じ遷移を逆向きに辿る。失敗で戻ったカードは .failed の枠が残り、一瞬 .flash で光る */
.anim { overflow: hidden; transition: height .26s ease, opacity .2s ease, transform .26s ease, margin .26s ease, padding .26s ease, border-width .26s ease; }
.leaving { opacity: 0; transform: translateX(14px); margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
.incoming { opacity: 0; transform: translateY(-8px); margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
.card.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 45% { box-shadow: 0 0 0 2px var(--warn); } 100% { box-shadow: 0 0 0 0 transparent; } }
/* トーストは右下に出す。幅は、カードの操作の行のボタン (左から「回答する」・「取り消して判断待ちに戻す」。main の左端から
   35〜240px ほど) に横から掛からない幅にする (トーストが 400px より細くなる幅では、左端が画面の左端から 254px)。
   100vw ではなく 100% にする: fixed の % はスクロールバーを除いた幅に対して決まり、right: 16px と main の位置もその幅で
   決まる (100vw だと常時表示のスクロールバーの分だけ広がる)。幅 640px 以下は下に全幅で出す (下の @media。右に置くと
   幅が 370px を切り、知らせが細長くなるため) */
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 5; width: min(400px, calc(100% - 270px)); pointer-events: none; }
.toast { display: flex; gap: 10px; align-items: flex-start; pointer-events: auto; overflow-wrap: anywhere;
  background: var(--toast-bg); color: var(--ink); border: 1px solid var(--toast-line); border-left: 4px solid var(--warn); border-radius: 8px;
  padding: 10px 8px 10px 14px; box-shadow: 0 6px 20px var(--toast-shadow); font-size: 14px; animation: toast-in .25s ease-out; }
.toast.ok { border-left-color: var(--rec); }
.toast .toast-msg { flex: 1; min-width: 0; }
.toast .toast-act { flex: none; align-self: center; background: none; color: var(--accent); border: 1px solid var(--toast-line); border-radius: 6px;
  font: inherit; font-size: 13px; font-weight: 700; padding: 2px 10px; cursor: pointer; }
.toast .toast-x { flex: none; background: none; border: 0; color: var(--muted); font: inherit; font-size: 18px; line-height: 1; padding: 0 6px; cursor: pointer; }
/* 幅の狭い画面では、トーストの重なりを横に避けられない。下に全幅で出し、ページの下にトーストの高さ (--toast-space。JS が測る) の
   余白を足す: 最後のカードの操作の行のボタンも、スクロールすればトーストの上に出せる */
@media (max-width: 640px) {
  #toasts { left: 8px; right: 8px; bottom: 8px; width: auto; }
  main { padding-bottom: calc(64px + var(--toast-space, 0px)); }
}
.toast.out { animation: toast-out .3s ease forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) {
  .card.flash, .toast, .toast.out { animation: none; }
  .anim { transition: none; }
}
</style>
</head>
<body>
<header><div class="bar">
  <h1>判断待ち</h1><span class="count" id="count">…</span>
  <span class="meta" id="meta"></span>
  <button class="ghost" id="notify" type="button">通知をオン</button>
</div></header>
<div id="notice" role="alert" hidden></div>
<nav id="tabs" aria-label="画面の切り替え"><div class="inner" role="tablist">
  <button class="tab" id="tab-human" type="button" role="tab" aria-selected="true" aria-controls="panel-human">判断待ち</button><button class="tab" id="tab-overview" type="button" role="tab" aria-selected="false" aria-controls="panel-overview" tabindex="-1">見通し</button>
</div></nav>
<div id="panel-human" role="tabpanel" aria-labelledby="tab-human">
<nav id="toc" aria-label="プロジェクトの目次" hidden><div class="inner">
  <div class="view" role="group" aria-label="並び"><button class="viewbtn" type="button" data-view="proj" aria-pressed="true">プロジェクトごと</button><button class="viewbtn" type="button" data-view="prio" aria-pressed="false">全体を優先度順</button></div>
  <div id="tocin"></div>
</div></nav>
<form id="filters" role="search" aria-label="絞り込みと検索" hidden><div class="inner">
  <label class="fld fsearch"><span>検索</span><input id="fq" type="search" placeholder="題・問い・背景・選択肢・ID" autocomplete="off"></label>
  <label class="fld" hidden><span>プロジェクト</span><select id="fproject"></select></label>
  <label class="fld" hidden><span>種別</span><select id="fkind"></select></label>
  <label class="fld" hidden><span>優先度</span><select id="fprio"></select></label>
  <label class="fld" hidden><span>ラベル</span><select id="flabel"></select></label>
  <label class="fld" hidden><span>保留中</span><select id="fsnoozed"></select></label>
  <span class="fcount" id="fcount" aria-live="polite" hidden></span>
  <button class="ghost" id="fclear" type="button" hidden>解除</button>
</div></form>
<main id="main"></main>
</div>
<div id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" hidden><div class="ov">
  <p class="ovtop">判断待ち <b id="ovcount">…</b> · <a href="#" id="ovback">判断待ちを開く</a></p>
  <p class="ovnote" id="ovstatus" aria-live="polite"></p>
  <div id="ovlist"></div>
</div></div>
<div id="toasts" aria-live="polite"></div>
<script>
const TOKEN = "__TOKEN__";
const POLL_MS = 15000;
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const DRAFT_KEY = "humanq-drafts";
const drafts = new Map();          // project + id -> {option, text}。sessionStorage にも置く (再読み込みで消えない)
const openBodies = new Set();      // 開いている「チケット本文」(project + id)
const openCtx = new Set();         // 全文を開いている「背景 (context)」(project + id)
// 押したカードの送信の状態 (key -> {state, path, seq})。画面から隠している間だけ持つ。
//   inflight: 送信中。データに居ても居なくても隠したまま (外すのは成功・失敗の処理だけ)
//   done:     成功した。seq は成功した時点で始まっていた最後の読み込みの番号。それより後に始めた読み込みの
//             データ (読めたプロジェクトのもの) が届けば、リストに居るかどうかに関係なく外す
const pending = new Map();
const errors = new Map();          // カードの key -> {summary, full} (送信の失敗。戻したカードに出す)
let seen = null;                   // 前回までに見た判断待ち (通知用)
let prevSnz = new Set();           // 前回の読みで保留中だった判断待ち (通知用)
let lastData = null;               // 最後に受け取ったデータ (正規化済み。書き換えない)
let loadSeq = 0;                   // load の通し番号
let failStreak = 0;                // 読み込みが続けて失敗した回数 (成功で 0)
let lastOkAt = null;               // 最後に読み込めた時刻 (ms)。まだ読めていなければ null
const STALE_MARK = " (古いデータ)";
let rendered = false;              // 最初の描画が済んだ (それまでは入場の動きを付けない)
let staleCount = 0;               // フォーカスがあって作り直しを後回しにしているカードの数

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}

// ---- 通信 ----------------------------------------------------------------------------

// written: 回答のコメントが書き込まれたか。サーバーが言ったときだけ true / false、分からなければ null (通信が切れた・内部エラーなど)。
// op: 送信の種類 (answer | undo | snooze | unsnooze)。サーバーが返さなくても、送ったパスから分かる
class ApiError extends Error {
  constructor(message, info) { super(message); Object.assign(this, { status: 0, code: null, stage: null, written: null, op: null }, info); }
}

// 書き込みの API のパスと送信の種類。OPS は種類ごとの、チケットの出どころ (src) と行き先 (dst) の一覧と、知らせの言い方
const OP_OF = { "/api/answer": "answer", "/api/undo": "undo", "/api/snooze": "snooze", "/api/unsnooze": "unsnooze" };
const OPS = {
  answer: { src: "human", dst: "answered", srcName: "判断待ち", dstName: "回答済み", what: "回答" },
  undo: { src: "answered", dst: "human", srcName: "回答済み", dstName: "判断待ち", what: "取り消し" },
  snooze: { src: "human", dst: "snoozed", srcName: "判断待ち", dstName: "保留中", what: "保留" },
  unsnooze: { src: "snoozed", dst: "human", srcName: "保留中", dstName: "判断待ち", what: "保留の解除" },
};
// 知らない種類 (サーバーが返した想定外の op を含む) は回答として扱う (今までの文言と同じ)
const opInfo = op => (Object.prototype.hasOwnProperty.call(OPS, op) ? OPS[op] : OPS.answer);

// 2xx でも JSON でなければ失敗にする。POST は {ok: true} が返ったときだけ成功
async function api(path, body) {
  const op = body ? OP_OF[path] || null : null;
  let r, text;
  try {
    r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Humanq-Token": TOKEN }, body: JSON.stringify(body) } : {});
    text = await r.text();
  } catch (e) {
    throw new ApiError(`サーバーに届かない (${e.message})`, { status: 0, code: "network", op });
  }
  let j = null;
  try { j = JSON.parse(text); } catch { /* JSON でない */ }
  const obj = j !== null && typeof j === "object";
  if (!r.ok) {
    throw new ApiError((obj && typeof j.error === "string" && j.error) || `HTTP ${r.status}`,
      { status: r.status, code: obj ? j.code || null : null, stage: obj ? j.stage || null : null,
        written: obj && typeof j.written === "boolean" ? j.written : null, op: (obj && typeof j.op === "string" && j.op) || op });
  }
  if (!obj) throw new ApiError(`想定外の応答 (HTTP ${r.status}、JSON ではない)`, { status: r.status, code: "format", op });
  if (body && j.ok !== true) throw new ApiError("想定外の応答 (ok が true でない)", { status: r.status, code: "format", op });
  return j;
}

// 失敗の文: summary は 1 行 (トースト用)、full は全文 (カードの中に畳んで置く)
function summarize(s, n = 120) {
  const first = String(s).trim().split("\n")[0].trim();
  return first.length > n ? first.slice(0, n - 1) + "…" : first;
}
const CHANGED_MSG = "問いが更新されました。見直してから送ってください";
const STALE_MSG = "取り消しませんでした。この回答はもう最新ではありません (ほかで答え直されています)";
function explain(e) {
  const full = String((e && e.message) || e);
  let summary;
  if (e.code === "changed") return { summary: CHANGED_MSG, full: CHANGED_MSG };
  if (e.status === 0) summary = "サーバーに届きませんでした (画面のサーバーが止まっている可能性があります)";
  else if (e.status === 413) summary = "補足が長すぎます";
  else if (e.stage === "label") summary = opInfo(e.op).what + "は記録済みですが、ラベルの付け替えだけ失敗しました: " + summarize(full, 70);
  else summary = summarize(full);
  return { summary, full };
}

// ---- 下書き ---------------------------------------------------------------------------

function saveDrafts() {
  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify([...drafts].filter(([, d]) => d.option || d.text))); } catch { /* 使えなくてもよい */ }
}
try {
  for (const [k, v] of JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "[]"))
    if (typeof k === "string" && v && typeof v === "object") drafts.set(k, { option: String(v.option || ""), text: String(v.text || "") });
} catch { /* 読めなければ空のまま */ }

// ---- 知らせ ---------------------------------------------------------------------------

// ms のあいだ、タブが見えている間だけ数えて fn を呼ぶ。返り値は取り消し
function whileVisible(ms, fn) {
  let left = ms, last = Date.now();
  const iv = setInterval(() => {
    const now = Date.now();
    if (!document.hidden) left -= now - last;
    last = now;
    if (left <= 0) { clearInterval(iv); fn(); }
  }, 250);
  return () => clearInterval(iv);
}

// 知らせのトースト。opts.kind が "ok" なら成功の知らせ (.toast.ok)。opts.action ({label, run}) で、閉じるの前にボタンを置く
// (押すとトーストを閉じてから run を呼ぶ)。同じ key (既定は文そのもの) のトーストが出ている間は重ねない。
// 同時に出すのは TOAST_MAX まで: 超えるときは、いちばん古いものを閉じるの経路で閉じる (action は走らせない)。
// 低い画面で知らせが積み上がると、古いトーストのボタンが画面の上に出るため。回答の取り消しは回答済みのカードにも残る
const TOAST_MAX = 3;
function toast(msg, opts = {}) {
  const box = document.getElementById("toasts");
  const key = opts.key || msg;
  if ([...box.children].some(t => t.dataset.key === key && !t.classList.contains("out"))) return;
  const live = [...box.children].filter(t => !t.classList.contains("out"));
  for (const old of live.slice(0, Math.max(0, live.length - TOAST_MAX + 1))) old.querySelector(".toast-x").click();
  const close = el("button", { class: "toast-x", type: "button", "aria-label": "閉じる" }, "×");
  const act = opts.action ? el("button", { class: "toast-act", type: "button" }, opts.action.label) : null;
  const t = el("div", { class: opts.kind ? "toast " + opts.kind : "toast", "data-msg": msg, "data-key": key },
    el("span", { class: "toast-msg" }, msg), act, close);
  let gone = false, cancel = () => {};
  const dismiss = () => {
    if (gone) return;
    gone = true; cancel();
    if (REDUCED) { t.remove(); return; }
    t.classList.add("out");
    t.addEventListener("animationend", () => t.remove(), { once: true });
    setTimeout(() => t.remove(), 600);
  };
  close.addEventListener("click", dismiss);
  // 閉じる動き (300ms) の間はまだ押せるので、閉じ始めた後の click では run を呼ばない
  if (act) act.addEventListener("click", () => { if (gone) return; dismiss(); opts.action.run(); });
  box.append(t);
  cancel = whileVisible(6000, dismiss);
}

// 回答が成功した知らせ。回答済みのカードはページの下にあり、次の読み込みまで作られないので、押し間違えたときに
// スクロールしなくても取り消せるよう「取り消す」を付ける。フォーカスはここへ移さない: 回答の後は次のカードそのものへ移す
// (moveFocusAway)。「回答する」を押した Enter のリピートや押し直しで、取り消しが押されないため。
// key に project と id を入れる: 題の頭 24 字と選択肢が同じ別のチケットの知らせ (取り消す先が違う) を重ね抑止で消さない。
// 同じチケットの前の答えの知らせは閉じてから出す (前の答えの「取り消す」から今の答えを取り消さない)。
// asig は成功の応答が返した、この回答の署名。「取り消す」はこれを付けて送り、ほかのタブ・セッションで答え直されていれば
// サーバーが断る (このタブを通らない変化は、上の閉じる処理では拾えない)
function answeredToast(it, label, asig) {
  const msg = `「${summarize(it.title, 24)}」に回答しました: ${summarize(label, 40)}`;
  dropAnsweredToasts(it);
  toast(msg, { kind: "ok", key: ["ok", it.project, it.id, msg].join("\n"), action: { label: "取り消す", run: () => undoAnswer(it, asig) } });
}

// そのチケットの回答の成功の知らせを閉じる。回答済みのカードで取り消したとき・答え直したとき・ほかで回答や取り消しが
// 反映されていた (400 gone) ときに呼ぶ。残すと、取り消し済みのチケットで押して「ほかで回答・反映済み」と出たり、
// 前の答えの知らせから今の答えを取り消したりする (知らせの文と、押して取り消すものが食い違う)
function dropAnsweredToasts(it) { dropToasts("ok", it); }
function dropToasts(kind, it) {
  const head = [kind, it.project, it.id, ""].join("\n");
  for (const t of document.querySelectorAll("#toasts .toast.ok:not(.out)"))
    if (t.dataset.key.startsWith(head)) t.querySelector(".toast-x").click();
}

// 保留が成功した知らせ。「解除」で判断待ちに戻せる (保留中の節は畳んであり、ページの下にある)。key と閉じ方は回答の知らせと同じ形
function snoozedToast(it, until) {
  const msg = `「${summarize(it.title, 24)}」を保留しました (${until ? `${until} に戻る` : "期限なし"})`;
  dropToasts("snz", it);
  toast(msg, { kind: "ok", key: ["snz", it.project, it.id, msg].join("\n"), action: { label: "解除", run: () => unsnoozeIt(it) } });
}

// 消えない案内 (サーバーが入れ替わった、など)
// 1 枠を種類 (kind) で共有する。token の案内 (再読み込みを求める) は、ほかの種類に上書きされず、成功でも消えない
let noticeKind = null;
function showNotice(msg, label, action, kind) {
  if (noticeKind === "token" && kind !== "token") return;
  const box = document.getElementById("notice");
  const btn = el("button", { class: "primary", type: "button" }, label);
  btn.addEventListener("click", action);
  box.replaceChildren(el("div", { class: "inner" }, el("span", {}, msg), btn));
  box.hidden = false;
  noticeKind = kind;
}
// kind の案内を出しているときだけ隠す (別の種類の案内は残す)
function hideNotice(kind) {
  if (noticeKind !== kind) return;
  const box = document.getElementById("notice");
  box.replaceChildren();
  box.hidden = true;
  noticeKind = null;
}
// 時刻 (hh:mm) の表示
function hhmm(ms) { return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

// ---- 動き (高さ・フォーカス) -------------------------------------------------------------

function bump(e) { e._anim = (e._anim || 0) + 1; return e._anim; }

// 遷移が終わったら .anim と高さの指定を外す (gen が変わっていたら、後から始まった動きの邪魔をしない)
function settle(e, gen) {
  let done = false;
  const onEnd = ev => { if (ev.target === e && ev.propertyName === "height") fin(); };
  const fin = () => {
    e.removeEventListener("transitionend", onEnd);
    if (done || e._anim !== gen) return;
    done = true;
    e.classList.remove("anim");
    e.style.height = "";
  };
  e.addEventListener("transitionend", onEnd);
  setTimeout(fin, 450);
}

// 新しい要素を、高さを 0 から広げて入れる
function enter(e) {
  if (REDUCED || !e.isConnected) return;
  const full = e.offsetHeight;
  if (!full) return;
  const gen = bump(e);
  e.classList.add("incoming");
  e.style.height = "0px";
  e.getBoundingClientRect();
  e.classList.add("anim");
  e.classList.remove("incoming");
  e.style.height = full + "px";
  settle(e, gen);
}

// 畳むカードがフォーカスを持っていたら、次のカード (無ければ前) の「カードそのもの」(tabindex="-1") へ移す。
// ボタンや選択肢には移さない: 「回答する」を押した Enter のリピートや押し直しが、移った先の
// 「取り消して判断待ちに戻す」や選択肢をそのまま押してしまうため。Tab を押せば中へ入れる
function moveFocusAway(card) {
  // 畳んだ節 (保留中・回答済み・反映待ち。閉じた details) の中のカードは見えずフォーカスできないので、移り先にしない
  const all = [...document.querySelectorAll("#main .card")].filter(c => c === card
    || (!c.inert && !c.classList.contains("leaving") && !c.closest("details:not([open])")));
  const i = all.indexOf(card);
  const next = all[i + 1] || all[i - 1];
  if (next) { next.focus(); return; }
  // 見えるカードがほかに無い (残りは畳んだ節の中だけ): フォーカスを捨てずに、畳んだ節の見出しの行 (summary) へ移す。
  // カードの後ろにある節を先に、無ければ前の節。カードの中の details (チケット本文など) の summary は含めない
  const sums = [...document.querySelectorAll("#main details.snz:not([open]) > summary, #main details.ansgrp:not([open]) > summary")];
  const to = sums.find(s => card.compareDocumentPosition(s) & Node.DOCUMENT_POSITION_FOLLOWING) || sums[sums.length - 1];
  if (to) to.focus();
}

// 高さを畳みながら消し、終わったら DOM から外して onGone を呼ぶ。畳んでいる間は unleave で戻せる
function leave(e, onGone) {
  if (e._leave) return;
  const st = { stop: () => {} };
  e._leave = st;
  const gone = () => { if (e._leave !== st) return; e.remove(); if (onGone) onGone(); };
  const isCard = e.classList.contains("card");
  if (isCard) {
    if (e.contains(document.activeElement)) moveFocusAway(e);
    e.inert = true;                  // 畳んでいる間は押せない・Tab で入れない
  }
  if (REDUCED || !e.isConnected) { gone(); return; }
  bump(e);
  e.style.height = e.offsetHeight + "px";
  e.getBoundingClientRect();         // 今の高さを確定させてから畳む (でないと遷移が起きない)
  e.classList.add("anim", "leaving");
  e.style.height = "0px";
  const onEnd = ev => { if (ev.target === e && ev.propertyName === "height") { st.stop(); gone(); } };
  e.addEventListener("transitionend", onEnd);
  const timer = setTimeout(() => { st.stop(); gone(); }, 450);
  st.stop = () => { e.removeEventListener("transitionend", onEnd); clearTimeout(timer); };
}

// 畳みかけの要素を元に戻す。カードは逆向きに広げる。見出しなどの入れ物は、中のカードが広がるので即座に戻す
function unleave(e) {
  const st = e._leave;
  if (!st) return;
  e._leave = null;
  st.stop();
  const gen = bump(e);
  if (!e.classList.contains("card")) {
    e.classList.remove("anim", "leaving");
    e.style.height = "";
    return;
  }
  e.inert = false;
  const cur = e.getBoundingClientRect().height;
  e.style.transition = "none";
  e.classList.remove("leaving");
  e.style.height = "";
  const full = e.offsetHeight;      // 本来の高さ
  e.classList.add("leaving");
  e.style.height = cur + "px";
  e.getBoundingClientRect();
  e.style.transition = "";
  e.classList.remove("leaving");
  e.style.height = full + "px";
  settle(e, gen);
}

function flash(e) {
  if (REDUCED) return;
  e.classList.remove("flash");
  void e.offsetWidth;
  e.classList.add("flash");
  e.addEventListener("animationend", () => e.classList.remove("flash"), { once: true });
}

// parent の子を wanted の並びにする。並びが合わないときだけ要素を動かす。
// 畳んでいる最中の要素 (.leaving) はそのままにして、wanted に無い要素は外す
function place(parent, wanted) {
  wanted = wanted.filter(Boolean);
  const want = new Set(wanted);
  for (const c of [...parent.children]) if (!want.has(c) && !c.classList.contains("leaving")) c.remove();
  let cur = parent.firstElementChild;
  for (const node of wanted) {
    while (cur && cur !== node && cur.classList.contains("leaving") && !want.has(cur)) cur = cur.nextElementSibling;
    if (cur === node) { cur = cur.nextElementSibling; continue; }
    parent.insertBefore(node, cur);
  }
}

// ---- カード ---------------------------------------------------------------------------

// `...` だけをコード表記にする (それ以外は textContent のまま)
function md(tag, cls, text) {
  const e = el(tag, { class: (cls ? cls + " " : "") + "md" });
  String(text).split("`").forEach((part, i) => { if (part) e.append(i % 2 ? el("code", {}, part) : part); });
  return e;
}

// 選択肢の label の先頭の【根本】【応急】【調査】【見送り】だけを、表示の側でチップにする (未知の【…】は文字のまま)。
// label の文字列・qsig・送る option は変えない
const DEPTH_HINTS = { 根本: "原因を取り除き、同じ症状が再発しない", 応急: "症状は止まるが原因は残る",
  調査: "まだ直さず、原因の特定や再現を先にする", 見送り: "今は何もしない (許容する・後に回す)" };
function optLabel(label) {
  const m = /^【(根本|応急|調査|見送り)】/.exec(String(label));
  const e = md("span", "l", m ? String(label).slice(m[0].length) : label);
  if (m) e.prepend(el("span", { class: "depth depth-" + m[1], title: DEPTH_HINTS[m[1]] }, m[1]));
  return e;
}

const qKey = (path, id) => "q\n" + path + "\n" + id;
const aKey = (path, id) => "a\n" + path + "\n" + id;
const sKey = (path, id) => "s\n" + path + "\n" + id;     // 保留中のカード
const KEY_OF = { q: qKey, a: aKey, s: sKey };
// head に出すラベル: humanq 自身のもの (human / answered / snoozed) を除いた全部。接頭辞では選ばない
// (snoozed は保留中の節と「保留中」の絞り込みで出すので、ラベルの印と「ラベル」の絞り込みには出さない)
const HUMANQ_LABELS = new Set(["human", "answered", "snoozed"]);
const shownLabels = it => (Array.isArray(it.labels) ? it.labels : []).filter(l => typeof l === "string" && !HUMANQ_LABELS.has(l));
const MAX_LABELS = 4;
// 作成日からの経過日数の表示 (暦の日数。当日は「今日」)。日付が読めない・未来のときは出さない
function ageText(created) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(created || ""));
  if (!m) return "";
  const now = new Date();
  const n = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(+m[1], +m[2] - 1, +m[3])) / 86400000);
  return n < 0 ? "" : n === 0 ? "今日" : `作成から ${n} 日`;
}
// カードの表示に使う値の署名。変わったカードだけ作り直す (受け取ったときに 1 度だけ作る)。
// 回答済みのカードには回答の署名 (asig) も入れる: 同じ本文で答え直された回答 (案 A → 取り消し → 案 A) でも作り直し、
// 「取り消して判断待ちに戻す」が今の回答の署名を送るようにする
// 書き込めるか (writable) と CLI の名前も入れる: 書き込めないプロジェクトのカードは回答の部品を出さないので、変わったら作り直す。
// プロジェクトの名前 (pname) も入れる: 全体の表示で head に出す
// 保留 (snooze) も入れる: 判断待ちのカードは保留から戻った旨を、保留中のカードは戻る日と補足と残りの日数を出す
const sigQ = it => JSON.stringify([it.id, it.title, it.priority, it.created_at, ageText(it.created_at), shownLabels(it), it.q, it.description, it.notes, it.writable, it.cli, it.pname, snoozeOf(it)]);
const sigA = it => JSON.stringify([it.id, it.title, it.priority, it.created_at, ageText(it.created_at), shownLabels(it), it.answer, it.asig, it.writable, it.cli, it.pname]);
const sigS = it => { const sn = snoozeOf(it); return JSON.stringify([it.id, it.title, it.priority, it.created_at, ageText(it.created_at), shownLabels(it), it.q && it.q.ask, sn, sn && sn.until ? untilText(sn.until) : "", it.writable, it.cli, it.pname]); };

// ---- 保留 (snooze) の日付 ----
// 保留の日付は「判断待ちに戻る日」(サーバーはその日の読みから判断待ちに出す)。今日はサーバーの今日 (/api/items の today)
// で数え、ブラウザの TZ では決めない。today を返さない (古い) サーバーのときだけ、ブラウザのローカルの日付を使う
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
let serverToday = null;            // 最後に受け取った /api/items の today (YYYY-MM-DD の形のときだけ)
const todayYmd = () => serverToday || ymd(new Date());
const dayNum = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || "")); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000 : null; };
const fmtDay = n => { const d = new Date(n * 86400000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; };
const validDay = s => typeof s === "string" && DATE_RE.test(s) && fmtDay(dayNum(s)) === s;     // 2 月 30 日などは読まない
// 今日から days 日後の日付 (暦の日数。UTC の日付の計算なので夏時間に左右されない)
const localDate = days => fmtDay(dayNum(todayYmd()) + days);
// 今日から戻る日までの日数 (暦の日数)。読めなければ null
function daysUntil(until) {
  const a = dayNum(until), b = dayNum(todayYmd());
  return a === null || b === null ? null : Math.round(a - b);
}
function untilText(until) {
  const n = daysUntil(until);
  return `${until} に戻る` + (n === 1 ? " (明日)" : n > 1 ? ` (あと ${n} 日)` : "");
}
// サーバーが付けた保留の情報 ({until, note, expired, changed})。形が崩れていれば、読める値だけを残す (until は文字列か null)
function snoozeOf(it) {
  const s = it && it.snooze;
  if (!s || typeof s !== "object") return null;
  return { until: typeof s.until === "string" ? s.until : null, note: typeof s.note === "string" ? s.note : "",
    expired: s.expired === true, changed: s.changed === true };
}
// 期間の選び方 (「日付を選ぶ」は別の入力)。days は判断待ちに戻るまでの日数 (その日に戻る)。null は期限なし
const SNOOZE_PRESETS = [["d1", "明日", 1], ["d3", "3 日後", 3], ["d7", "1 週間後", 7], ["none", "期限なし", null]];
const snzDrafts = new Map();       // 下書きの key -> {open, kind, date, note}。保留の欄の状態 (カードが作り直されても保つ。メモリだけ)
// 書き込めないプロジェクト (writable:false。br を読みだけで返す 0.13〜0.14 のサーバー) のカードに、回答の部品の代わりに出す 1 行
const readonlyNote = it => el("p", { class: "ro" }, `このプロジェクト${it.cli ? ` (${it.cli}) ` : ""}は画面からはまだ回答できません`);

// ID をクリップボードへ。結果は ID の隣に 1.5 秒だけ出す (押した後に何も起きないと、コピーできたか分からない)
const COPIED_MS = 1500;
async function copyId(id, out) {
  let ok = false;
  try { await navigator.clipboard.writeText(id); ok = true; } catch { /* 権限なし・非対応 */ }
  out.textContent = ok ? "コピーしました" : "コピーできませんでした";
  clearTimeout(out._t);
  out._t = setTimeout(() => { out.textContent = ""; }, COPIED_MS);
}

function head(it) {
  const p = typeof it.priority === "number" ? it.priority : 9;
  const labels = shownLabels(it);
  const age = ageText(it.created_at);
  const copied = el("output", { class: "copied" });     // コピーの結果の知らせ (output は暗黙の role=status。.head > span には数えない)
  return el("div", { class: "head" },
    el("span", { class: `prio p${p}` }, `P${p}`),
    // プロジェクトの名前 (CSS で全体の表示の中のカードにだけ出す。表示を切り替えてもカードは作り直さない)。.head > span には数えない
    el("b", { class: "pj", title: it.project }, it.pname),
    el("button", { class: "id", type: "button", title: "押すと ID をコピー", onclick: () => copyId(it.id, copied) }, it.id),
    copied,
    el("span", {}, age ? `${it.created_at} (${age})` : it.created_at),
    ...labels.slice(0, MAX_LABELS).map(l => el("span", {}, l)),
    labels.length > MAX_LABELS ? el("span", { title: labels.join("\n") }, `+${labels.length - MAX_LABELS}`) : null);
}

function body(it) {
  const t = [it.description, it.notes ? "--- notes\n" + it.notes : ""].filter(Boolean).join("\n\n");
  const key = it.project + "\n" + it.id;
  const d = el("details", { open: openBodies.has(key) }, el("summary", {}, "チケット本文"), el("pre", {}, t || "(本文なし)"));
  d.addEventListener("toggle", () => { d.open ? openBodies.add(key) : openBodies.delete(key); });
  return d;
}

// 背景は 5 行で畳み、実際に溢れているときだけ「続きを読む」を出す。開いたかどうかは key で覚える (カードが作り直されても保つ)。
// 溢れの判定は DOM に載ってからでないと測れないので、ResizeObserver で測る (幅が変わって行数が変わっても追う)
function context(it, text) {
  const key = it.project + "\n" + it.id;
  const p = md("p", "ctx", text);
  const btn = el("button", { class: "ctxmore", type: "button", hidden: "" });
  const sync = () => {
    const open = openCtx.has(key);
    p.classList.toggle("clamp", !open);
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? "閉じる" : "続きを読む";
    btn.hidden = !open && !(p.scrollHeight > p.clientHeight + 1);
  };
  btn.addEventListener("click", () => { openCtx.has(key) ? openCtx.delete(key) : openCtx.add(key); sync(); });
  p.classList.add("clamp");
  sync();
  const box = el("div", { class: "ctxbox" }, p, btn);
  if (window.ResizeObserver) new ResizeObserver(sync).observe(p);
  return box;
}

// カードの名前にする要素の id (カードを作るたびに新しい番号。project や id は空白や記号を含みうるので使わない)
let labelSeq = 0;
const nextLabelId = () => "card-label-" + (++labelSeq);

const dkOf = it => it.project + "\n" + it.id;           // 下書きの key
function dropDraft(it) { drafts.delete(dkOf(it)); saveDrafts(); }

// 書き込めないプロジェクト (writable:false) の判断待ちのカード。問い・背景・選択肢 (押せない一覧) は同じように見せ、
// 選択肢のボタン・補足欄・「回答する」は出さずに 1 行の案内を出す。下書きも作らない
function buildReadonlyQuestion(it) {
  const q = it.q;
  const ask = md("p", "ask", q ? q.ask : it.title);
  ask.id = nextLabelId();
  const opts = q && q.options.length ? el("ul", { class: "roopts" }, q.options.map(o =>
    el("li", o.key === q.recommended ? { class: "rec" } : {},
      o.key === q.recommended ? el("span", { class: "badge" }, "推奨") : null, optLabel(o.label),
      o.desc ? md("span", "d", o.desc) : null))) : null;
  return el("section", { class: "card", "data-id": it.id, tabindex: "-1", "aria-labelledby": ask.id },
    head(it),
    q ? el("p", { class: "title" }, it.title) : null,
    ask,
    q && q.context ? context(it, q.context) : null,
    !q ? el("p", { class: "ctx" }, "問いがまだ整理されていません。") : null,
    opts, readonlyNote(it), el("div", { class: "errbox" }), body(it));
}

// 判断待ちのカードの「保留」と、押すと開く欄。判断待ちに戻す日 (明日 / 3 日後 / 1 週間後 / 期限なし) か日付 (明日以降) を選び、
// 補足を書いて「保留する」で送る (選ぶだけでは送らない)。欄の状態は snzDrafts に置き、カードが作り直されても保つ。
// 戻る日は送るときに数える (日付が変わっても今日から数える)。返り値は {toggle (「保留」のボタン), box (欄)}
function snoozePanel(it, key) {
  const dk = dkOf(it);
  const st = snzDrafts.get(dk) || { open: false, kind: "", date: "", note: "" };
  snzDrafts.set(dk, st);
  const toggle = el("button", { class: "ghost snz", type: "button", "aria-expanded": String(st.open) }, "保留");
  const presets = SNOOZE_PRESETS.map(([kind, label]) => {
    const b = el("button", { class: "snzopt", type: "button", "data-kind": kind, "aria-pressed": "false" }, label);
    b.addEventListener("click", () => { st.kind = st.kind === kind ? "" : kind; sync(); });
    return b;
  });
  const date = el("input", { type: "date", "aria-label": "判断待ちに戻す日" });
  const dateBox = el("label", { class: "snzdate" }, "日付を選ぶ", date);
  const note = el("input", { type: "text", class: "snznote", "aria-label": "保留の補足", maxlength: "2000",
    placeholder: "補足 (任意)。例: 情報が揃うまで・来週の会議で決める" });
  const go = el("button", { class: "snzgo", type: "button" }, "保留する");
  const cancel = el("button", { class: "ghost snzcancel", type: "button" }, "やめる");
  const box = el("div", { class: "snzbox", role: "group", "aria-label": "判断待ちに戻す日と補足" },
    el("div", { class: "snzopts" }, el("span", { class: "snzlead" }, "戻す日:"), presets, dateBox), note, el("div", { class: "snzrow" }, go, cancel));
  date.value = st.date;
  note.value = st.note;
  // 選べるのは明日以降 (戻る日の当日から判断待ちに出すので、今日を選ぶと保留にならない)
  const pickedDate = () => DATE_RE.test(date.value) && date.value >= localDate(1) ? date.value : null;
  const sync = () => {
    box.hidden = !st.open;
    toggle.setAttribute("aria-expanded", String(st.open));
    for (const b of presets) b.setAttribute("aria-pressed", String(b.dataset.kind === st.kind));
    dateBox.classList.toggle("sel", st.kind === "pick");
    go.disabled = !(st.kind && st.kind !== "pick" || (st.kind === "pick" && pickedDate()));
  };
  const setOpen = open => {
    st.open = open;
    if (open) date.min = localDate(1);
    sync();
  };
  toggle.addEventListener("click", () => setOpen(!st.open));
  cancel.addEventListener("click", () => { setOpen(false); toggle.focus(); });
  date.addEventListener("input", () => { st.date = date.value; st.kind = date.value ? "pick" : (st.kind === "pick" ? "" : st.kind); sync(); });
  note.addEventListener("input", () => { st.note = note.value; });
  box.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Escape") { e.stopPropagation(); setOpen(false); toggle.focus(); }
    else if (e.key === "Enter" && e.target === note && !e.shiftKey && !e.altKey) { e.preventDefault(); go.click(); }
  });
  go.addEventListener("click", () => {
    if (go.disabled || pending.has(key)) return;
    if (questionChanged(it)) { reviewChanged(key, it); return; }
    const preset = SNOOZE_PRESETS.find(p => p[0] === st.kind);
    const until = st.kind === "pick" ? pickedDate() : preset && preset[2] !== null ? localDate(preset[2]) : null;
    if (st.kind === "pick" && !until) return;
    submit(key, it, "/api/snooze", { project: it.project, id: it.id, qsig: it.qsig, until, note: note.value },
      () => { snzDrafts.delete(dk); snoozedToast(it, until); });
  });
  sync();
  return { toggle, box };
}

function buildQuestion(it) {
  if (it.writable === false) return buildReadonlyQuestion(it);
  const key = qKey(it.project, it.id);
  const dk = dkOf(it);
  const q = it.q;
  const d = drafts.get(dk) || { option: "", text: "" };
  if (d.option && !(q && q.options.some(o => o.key === d.option))) d.option = "";   // 問いが変わって無くなった選択肢
  drafts.set(dk, d);
  const send = el("button", { class: "primary", type: "button", "aria-keyshortcuts": "Meta+Enter Control+Enter" }, "回答する");
  const area = el("textarea", { "aria-label": q && q.options.length ? "補足" : "回答", placeholder: q && q.options.length ? "補足 (任意)。選択肢に無い答えはここに書く"
    : q && q.kind === "task" ? "結果を書く" : "回答を書く" });
  area.value = d.text;
  const refresh = () => { send.disabled = !(d.option || d.text.trim()); };
  area.addEventListener("input", () => { d.text = area.value; refresh(); saveDrafts(); });
  const opts = q && q.options.length ? el("div", { class: "opts" }, q.options.map(o => {
    const rec = o.key === q.recommended;
    const b = el("button", { class: "opt" + (rec ? " rec" : "") + (d.option === o.key ? " sel" : ""), type: "button",
      "aria-pressed": String(d.option === o.key) },
      rec ? el("span", { class: "badge" }, "推奨") : null, optLabel(o.label),
      o.desc ? md("span", "d", o.desc) : null);
    b.addEventListener("click", () => {
      d.option = d.option === o.key ? "" : o.key;
      for (const s of b.parentNode.children) { s.classList.remove("sel"); s.setAttribute("aria-pressed", "false"); }
      if (d.option) { b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); }
      refresh();
      saveDrafts();
    });
    return b;
  })) : null;
  send.addEventListener("click", () => {
    if (!(d.option || d.text.trim()) || pending.has(key)) return;
    // 入力中で作り直しを後回しにしている間に問いが変わっていたら、送らずに作り直して見直してもらう
    if (questionChanged(it)) { reviewChanged(key, it); return; }
    // 下書きは成功するまで残す (失敗して戻ったカードに選択と補足がそのまま出る)。qsig は見ていた問いの署名。
    // 成功の知らせには、送った時点の選択と、応答が返した回答の署名を渡す (成功すると下書きは消える)
    const chosen = d.option && q ? q.options.find(o => o.key === d.option) : null;
    submit(key, it, "/api/answer", { project: it.project, id: it.id, option: d.option, text: d.text, qsig: it.qsig },
      res => { dropDraft(it); answeredToast(it, chosen ? chosen.label : "(自由記述)", res.asig); });
  });
  refresh();
  const ask = md("p", "ask", q ? q.ask : it.title);
  ask.id = nextLabelId();                                   // カードの名前 (aria-labelledby)
  const snz = snoozePanel(it, key);
  const sn = snoozeOf(it);
  // 保留から戻ったカードには、戻った理由 (保留の後に問いが書き換わった / 戻る日が来た) と保留したときの補足を出す
  // (何を待っていたかを思い出せる)
  const why = !sn ? null : sn.changed ? "保留の後に問いが書き換わったので、判断待ちに戻りました"
    : sn.expired ? `保留の戻る日${sn.until ? ` (${sn.until}) ` : ""}が来たので、判断待ちに戻りました` : null;
  const back = why ? el("p", { class: "snzback" }, why + (sn.note ? `。補足: ${sn.note}` : "")) : null;
  // 「保留」は「回答する」の隣 (キーのヒントより前): .row のボタンは、右下のトーストに横から掛からない幅に収める
  const card = el("section", { class: "card", "data-id": it.id, tabindex: "-1", "aria-labelledby": ask.id },
    head(it), back,
    q ? el("p", { class: "title" }, it.title) : null,      // 問いが無いときは、ask の位置にタイトルを出すので重ねない
    ask,
    q && q.context ? context(it, q.context) : null,
    !q ? el("p", { class: "ctx" }, "問いがまだ整理されていません。本文を読んで自由に答えてください。") : null,
    opts, area, el("div", { class: "row" }, send, snz.toggle, el("span", { class: "keyhint", "aria-hidden": "true" }, "⌘↵ / Ctrl+↵ で送信")),
    snz.box, el("div", { class: "errbox" }), body(it));
  // キー操作。Cmd+Enter / Ctrl+Enter は、補足欄か選択肢にフォーカスがあれば「回答する」を押したのと同じ (送れない状態の
  // click() は何もしない)。カードそのもの (tabindex="-1") にフォーカスがあるときは、数字でその番の選択肢を選ぶ (送らない)。
  // カードそのものでの Cmd/Ctrl+Enter は、そこで数字を押して選んだ後だけ効く (picked。カードからフォーカスが離れたら解く)。
  // 回答の後はフォーカスが次のカードそのものへ移る (moveFocusAway) ので、Cmd/Ctrl+Enter の押し直しやリピートが、
  // 次のカードの前からある下書きの選択をそのまま送らないため。数字は送った直後でも効く (次のカードを選ぶだけで、送らない)
  let picked = false;
  card.addEventListener("blur", () => { picked = false; });
  card.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return;          // IME の変換中 (変換を確定する Enter を含む)
    const self = e.target === card;
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      if (e.target === area || e.target.classList.contains("opt") || (self && picked)) send.click();
      return;
    }
    if (!self || !opts || e.ctrlKey || e.metaKey || e.altKey || !/^[1-9]$/.test(e.key)) return;
    const b = opts.children[Number(e.key) - 1];
    if (!b) return;
    if (!b.classList.contains("sel")) b.click();             // 選ぶだけ (押した選択肢をもう一度押しても外さない)
    picked = true;
  });
  return card;
}

// 回答を取り消して判断待ちに戻す (回答済みのカードのボタンと、回答の成功のトーストの「取り消す」)。
// 送り先は project と id だけで決まるので、回答済みのカードがまだ作られていなくても送れる。失敗と 400 gone・409 stale は、
// カードの有無に関係なく failed() がトーストで知らせる。成功したら読み直して、カードは判断待ちに戻る。
// 戻ったカードに下書きは戻さない (空のまま): 回答の成功で下書きは消してあり、押し間違えた選択をそのまま戻すと
// 同じ答えを押し直しやすい。送った回答の本文は bd のコメントに残っている。
// asig は取り消す回答の署名 (トーストは成功の応答の値、カードは回答済みの一覧の値)。サーバーは今の回答の署名と違えば
// 409 stale で断る。署名が分からないときは空で送る (付けないと署名を送らない古い画面と同じに読まれ、照合されない)
function undoAnswer(it, asig) {
  const key = aKey(it.project, it.id);
  dropAnsweredToasts(it);                   // カードで取り消したら、その回答の知らせ (「取り消す」付き) も閉じる
  if (pending.has(key)) return;             // もう一方の取り消しで送信中
  submit(key, it, "/api/undo", { project: it.project, id: it.id, asig: typeof asig === "string" ? asig : "" });
}

// 回答済みの本文。1 行目の末尾の " (<key>)" は、その key が問いの選択肢のどれかと一致するときだけ外す
// (label 自体が括弧で終わるもの、自由記述、問いの無いチケットはそのまま)
function answerText(it) {
  const t = (it.answer || "(回答のコメントが見つからない)").replace(/^\[humanq\] /, "");
  if (!it.q || !Array.isArray(it.q.options)) return t;
  const nl = t.indexOf("\n");
  const first = nl < 0 ? t : t.slice(0, nl);
  const m = /^(.* )\((.+)\)$/.exec(first);
  return m && it.q.options.some(o => o.key === m[2]) ? m[1].replace(/ $/, "") + (nl < 0 ? "" : t.slice(nl)) : t;
}

function buildAnswered(it) {
  let ctrl;
  if (it.writable === false) ctrl = readonlyNote(it);            // 書き込めないプロジェクトには取り消しのボタンを出さない
  else {
    const b = el("button", { class: "ghost", type: "button" }, "取り消して判断待ちに戻す");
    b.addEventListener("click", () => undoAnswer(it, it.asig));  // カードが出している回答の署名
    ctrl = el("div", { class: "row" }, b);
  }
  const title = el("p", { class: "title", id: nextLabelId() }, it.title);
  return el("section", { class: "card", "data-id": it.id, tabindex: "-1", "aria-labelledby": title.id }, head(it), title,
    el("p", { class: "ans" }, answerText(it)),
    ctrl, el("div", { class: "errbox" }));
}

// 保留中のカード (ページの下の畳んだ節に出す)。題・戻る日 (と残りの日数)・補足と「保留を解除」。回答の部品は出さない
// (答えるときは解除して判断待ちに戻す)。書き込めないプロジェクトには解除のボタンを出さない
function buildSnoozed(it) {
  const sn = snoozeOf(it) || { until: null, note: "" };
  let ctrl;
  if (it.writable === false) ctrl = readonlyNote(it);
  else {
    const b = el("button", { class: "ghost", type: "button" }, "保留を解除");
    b.addEventListener("click", () => unsnoozeIt(it));
    ctrl = el("div", { class: "row" }, b);
  }
  const title = el("p", { class: "title", id: nextLabelId() }, it.title);
  return el("section", { class: "card snzcard", "data-id": it.id, tabindex: "-1", "aria-labelledby": title.id }, head(it), title,
    el("p", { class: "snzinfo" }, "保留: " + (sn.until ? untilText(sn.until) : "期限なし")),
    sn.note ? el("p", { class: "snznotetext" }, "補足: " + sn.note) : null,
    ctrl, el("div", { class: "errbox" }));
}

// 保留を解除して判断待ちに戻す (保留中のカードの「保留を解除」と、保留の成功のトーストの「解除」)。送り先は project と id だけで
// 決まるので、保留中のカードがまだ作られていなくても送れる。自分で戻したものは「判断待ちが増えました」の通知に数えない
function unsnoozeIt(it) {
  const key = sKey(it.project, it.id);
  dropToasts("snz", it);
  if (pending.has(key)) return;
  submit(key, it, "/api/unsnooze", { project: it.project, id: it.id }, () => {
    if (seen) seen.add(it.project + "\n" + it.id);
    toast(`「${summarize(it.title, 24)}」の保留を解除しました`, { kind: "ok", key: ["unsnz", it.project, it.id].join("\n") });
  });
}

// 失敗の表示 (カードの枠と、中の全文)。エラーが変わったときだけ中身を作り直す
function syncError(c, key) {
  const e = errors.get(key);
  c.el.classList.toggle("failed", !!e);
  const box = c.el.querySelector(".errbox");
  const shown = e ? e.summary + "\n" + e.full : "";
  if (!box || box.dataset.shown === shown) return;
  box.dataset.shown = shown;
  box.replaceChildren();
  if (!e) return;
  box.append(e.full === e.summary
    ? el("span", { class: "err" }, "送信できませんでした: " + e.summary)
    : el("details", {}, el("summary", { class: "err" }, "送信できませんでした: " + e.summary), el("pre", {}, e.full)));
}

// ---- 描き直し (key ごとの突き合わせ) --------------------------------------------------------------
// main の中身は作り直さない。プロジェクト → 節 (判断 / 作業・確認 / 回答済み) → カードの入れ物を key ごとに持ち、
// 署名が変わったカードだけ作り直す。データから消えた (送信中のものも含む) カードは畳む。
// 回答済みの節は、どちらの表示でも details に包み、初めは畳む (makeGroup)。
// 全体を優先度順の表示 (view が "prio") では、プロジェクトの入れ物の代わりに 1 つの入れ物 (flatBox) に、
// 読めなかったプロジェクトのバナー → 判断待ち (全プロジェクトを優先度 → 作成日の順) → 回答済み (同じ順) を並べる。
// カードの key と要素は両方の表示で共通で、表示を切り替えても作り直さずに入れ物を移すだけ (入力・フォーカス・開いた本文を保つ)

const cards = new Map();           // key -> {el, sig}
const projs = new Map();           // path -> {el, h2, banner, chip, groups: Map(kind -> {el, h3})}
const TITLES = { dec: "判断", task: "作業・確認", ans: "回答済み・反映待ち" };
const FLAT_TITLES = { wait: "判断待ち", ans: "回答済み・反映待ち" };
let flatBox = null;                // 全体の表示の入れ物 {el, groups: Map(kind -> {el, h3}), banners: Map(path -> el)}
let emptyNote = null, idleNote = null;
// 節の入れ物 {el, h3 (見出し。ここへ件数つきの文を書く), top (入れ物の最初の子。place に渡す)}。
// 判断 / 作業・確認 / 判断待ち (全体の表示) は div に見出しとカードを並べる。回答済み・反映待ち (ans) は details で包み、初めは畳む:
// 見出し (プロジェクトごとの表示は h3、全体の表示は h2.sec) は summary の中に置き、カードは summary の後ろに並べる。
// 開いたかどうかは入れ物ではなく openAns が覚える (key はプロジェクトの path、全体の表示は固定の FLAT_ANS_KEY): 読み込みでは入れ物を
// 作り直さないが、節が空になって外れた後や表示を切り替えた後に作り直しても、開いていた節は開いたまま出る (ページを読み直すと畳んだ状態に戻る)
const FLAT_ANS_KEY = "\nflat";
const openAns = new Set();
// 回答済みの節の見出しの文。失敗 (取り消しの失敗で戻ったカードの赤い枠) が中にあるときだけ「(失敗 n 件)」を足し、行を警告の色にする:
// 節は畳んだままなので、トーストが消えた後も、失敗したカードがあると見出しで分かる
function syncAnsHead(g, title, list) {
  const f = list.filter(i => errors.has(aKey(i.project, i.id))).length;
  g.h3.textContent = `${title} (${list.length})` + (f ? ` (失敗 ${f} 件)` : "");
  g.top.classList.toggle("hasfail", f > 0);
}
function makeGroup(kind, tag, cls, openKey) {
  const h3 = el(tag, cls ? { class: cls } : {});
  if (kind !== "ans") return { el: el("div", { class: "grp", "data-kind": kind }), h3, top: h3 };
  const top = el("summary", {}, h3);
  const d = el("details", { class: "grp ansgrp", "data-kind": kind, open: openAns.has(openKey) }, top);
  d.addEventListener("toggle", () => { d.open ? openAns.add(openKey) : openAns.delete(openKey); });
  return { el: d, h3, top };
}
// 保留中の節の見出しの文。解除に失敗して戻ったカード (赤い枠) が中にあるときだけ「(失敗 n 件)」を足し、行を警告の色にする
// (回答済みの節の syncAnsHead と同じ。節は畳んだままで、開閉の覚えも変えない)
function syncSnzHead(sb, list) {
  const f = list.filter(i => errors.has(sKey(i.project, i.id))).length;
  sb.h.textContent = `保留中 (${list.length})` + (f ? ` (失敗 ${f} 件)` : "");
  sb.sum.classList.toggle("hasfail", f > 0);
}
// 保留中の節 {el (details。既定は閉じる), sum (summary), h (見出し h2)}。判断待ちの一覧から外したものを、ページの下にまとめる
let snzBox = null;
function makeSnzBox() {
  const h = el("h2", { class: "sec" });
  const sum = el("summary", {}, h);
  return { el: el("details", { class: "snz" }, sum), sum, h };
}
// 保留中の並び: 戻る日の早いもの (期限なし・読めない戻る日は最後) → 優先度 → 作成日
const untilOf = it => { const s = snoozeOf(it); return s && s.until && DATE_RE.test(s.until) ? s.until : null; };
const bySnooze = (x, y) => {
  const ux = untilOf(x), uy = untilOf(y);
  if (ux !== uy) return ux === null ? 1 : uy === null ? -1 : ux < uy ? -1 : 1;
  return byPrio(x, y);
};

// 並び: "proj" (プロジェクトごと。既定) / "prio" (全体を優先度順)。選んだほうは localStorage に覚える
// (読み書きできなくても既定の表示で動き、切り替えも効く)
const VIEW_KEY = "humanq-view";
let view = "proj";
try { if (localStorage.getItem(VIEW_KEY) === "prio") view = "prio"; } catch { /* 読めなければ既定の表示 */ }
const viewBtns = [...document.querySelectorAll("#toc .viewbtn")];
const syncViewBtns = () => { for (const b of viewBtns) b.setAttribute("aria-pressed", String(b.dataset.view === view)); };
syncViewBtns();
for (const b of viewBtns) b.addEventListener("click", () => {
  if (b.dataset.view === view) return;
  view = b.dataset.view;
  try { localStorage.setItem(VIEW_KEY, view); } catch { /* 覚えられなくても切り替えは効く */ }
  syncViewBtns();
  // カードは今ある要素を新しい入れ物へ移すだけで、新しく入るカードは無い (畳む・入る動きは付かない)
  try { render(); } catch (e) { console.error(e); }
});
// 全体の表示の並び: 優先度 (数でなければ 9) → 作成日。同じなら元の並び (プロジェクトの順 → サーバーの並び) のまま
const createdOf = it => String(it.created_at || "");
const byPrio = (x, y) => prioOf(x) - prioOf(y) || (createdOf(x) < createdOf(y) ? -1 : createdOf(x) > createdOf(y) ? 1 : 0);

// 目次の帯のチップ (プロジェクトごとに 1 つ。作り直さず中身だけ合わせる: 押した・フォーカスしたチップが読み込みで消えない)。
// q は送信中を除いた判断待ち (見出しの件数と同じ数)。P0 の印も送信中を除いて決める
function syncChip(pr, p, q) {
  if (!pr.chip) {
    const name = el("span", { class: "tocname" }), n = el("span", { class: "tocn" }), mark = el("span", { class: "tocp0", hidden: "" }, "P0");
    const b = el("button", { class: "tocchip", type: "button", title: p.path, "data-path": p.path }, name, n, mark);
    b.addEventListener("click", () => jumpTo(p.path));
    pr.chip = { el: b, name, n, mark };
  }
  const c = pr.chip, p0 = q.some(i => i.priority === 0);
  c.name.textContent = p.name;
  c.n.textContent = String(q.length);
  c.mark.hidden = !p0;
  c.el.setAttribute("aria-label", `${p.name}: 判断待ち ${q.length} 件${p0 ? "、P0 あり" : ""}`);
  return c.el;
}

// チップから、そのプロジェクトの見出しへページ内で飛ぶ。動きを減らす設定では滑らかにしない。
// フォーカスは見出し (tabindex="-1") へ移す: 帯はスクロールで流れるので、チップに残すと次の Tab で帯へ戻り、ページが上へ戻る
function jumpTo(path) {
  const pr = projs.get(path);
  if (!pr) return;                   // チップは同じ描き直しで見出しと一緒に外れるので、普通は届かない
  pr.h2.focus({ preventScroll: true });
  pr.el.scrollIntoView({ block: "start", behavior: REDUCED ? "auto" : "smooth" });
}

// 入れ物を畳み終えたら (または空なら) 外す。onGone は外れたあとの片付け
function retire(e, onGone) {
  if (e._leave) return;
  if (e.querySelector(".card")) leave(e, onGone);
  else { e.remove(); onGone(); }
}

// ---- 絞り込みと検索 (表示の側だけ。サーバーと bd / br の読みは変えない) ---------------------------------
// 状態は URL の query (project / kind / prio / label / q / snoozed) に持つ (再読み込みで残る)。帯の部品は作り直さない
// (入力中の文字が 15 秒ごとの読み込みで消えない)。選択肢の一覧は、変わったときだけ書き換える。
// 隠すのは表示だけ: 判断待ちの件数 (ヘッダー・タイトル・通知) は全件を数え、下書きと失敗の表示は残す。
// 保留中のカードにも同じ絞り込みが効き、snoozed=hide (「保留中: 含めない」) で保留中の節ごと出さない

const FILTER_KEYS = ["project", "kind", "prio", "label", "q", "snoozed"];
const flt = { project: "", kind: "", prio: "", label: "", q: "", snoozed: "" };
try { const sp = new URLSearchParams(location.search); for (const k of FILTER_KEYS) flt[k] = sp.get(k) || ""; } catch { /* 読めなければ絞り込み無し */ }
const filterActive = () => FILTER_KEYS.some(k => flt[k] !== "");
let instantRender = false;         // 絞り込みを変えたことによる描き直し: 隠れるカードを畳まず外し、現れるカードに入場の動きを付けない

function syncUrl() {
  try {
    const sp = new URLSearchParams(location.search);
    for (const k of FILTER_KEYS) { if (flt[k] !== "") sp.set(k, flt[k]); else sp.delete(k); }
    const s = sp.toString();
    history.replaceState(null, "", location.pathname + (s ? "?" + s : "") + location.hash);
  } catch { /* URL に書けなくても絞り込みは効く */ }
}

const prioOf = it => (typeof it.priority === "number" ? it.priority : 9);
const kindOf = it => (!it.q ? "none" : it.q.kind === "task" ? "task" : "decision");
const KIND_LABELS = { decision: "判断 (decision)", task: "作業・確認 (task)", none: "問いなし" };
// 検索の対象: 題・問い (ask)・背景 (context)・選択肢の label・ID。大文字小文字を区別しない部分一致 (項目ごとに照合し、項目をまたがない)
function searchFields(it) {
  const q = it.q || {};
  return [it.id, it.title, q.ask, q.context, ...(Array.isArray(q.options) ? q.options.map(o => o && o.label) : [])]
    .filter(x => typeof x === "string").map(x => x.toLowerCase());
}
function matchesFilter(it) {
  if (flt.project !== "" && it.project !== flt.project) return false;
  if (flt.kind !== "" && kindOf(it) !== flt.kind) return false;
  if (flt.prio !== "" && String(prioOf(it)) !== flt.prio) return false;
  if (flt.label !== "" && !shownLabels(it).includes(flt.label)) return false;
  const needle = flt.q.trim().toLowerCase();
  return !needle || searchFields(it).some(f => f.includes(needle));
}

const filterBox = document.getElementById("filters");
const fq = document.getElementById("fq");
fq.value = flt.q;
// opts は [値, 表示, title] の並び。今の値が一覧に無いとき (URL の値・データから消えた値) は足して、解除できる状態を保つ
function setSelect(id, field, all, opts, minChoices) {
  const sel = document.getElementById(id);
  const list = opts.slice();
  if (flt[field] !== "" && !list.some(o => o[0] === flt[field])) list.push([flt[field], flt[field] + " (該当なし)"]);
  const sig = JSON.stringify([all, list]);
  if (sel.dataset.sig !== sig) {
    sel.dataset.sig = sig;
    sel.replaceChildren(el("option", { value: "" }, all), ...list.map(o => el("option", { value: o[0], title: o[2] }, o[1])));
  }
  sel.value = flt[field];
  sel.parentNode.hidden = !(opts.length >= minChoices || flt[field] !== "");
}
function syncFilterBar(total, visible) {
  const projects = [], kinds = new Set(), prios = new Set(), labels = new Set();
  let any = false, anySnoozed = false;
  for (const p of lastData.projects) {
    const items = [...p.human, ...p.answered, ...p.snoozed];
    if (items.length || !p.ok) projects.push(p);      // 読めなかったプロジェクトも選べる (バナーだけを見られる)
    if (p.snoozed.length) anySnoozed = true;
    for (const i of items) { any = true; kinds.add(kindOf(i)); prios.add(prioOf(i)); for (const l of shownLabels(i)) labels.add(l); }
  }
  const act = filterActive();
  filterBox.hidden = !(any || act);
  setSelect("fproject", "project", "すべてのプロジェクト", projects.map(p => [p.path, p.name, p.path]), 2);
  setSelect("fkind", "kind", "すべての種別", ["decision", "task", "none"].filter(k => kinds.has(k)).map(k => [k, KIND_LABELS[k]]), 2);
  setSelect("fprio", "prio", "すべての優先度", [...prios].sort((a, b) => a - b).map(n => [String(n), "P" + n]), 2);
  setSelect("flabel", "label", "すべてのラベル", [...labels].sort().map(l => [l, l]), 1);
  setSelect("fsnoozed", "snoozed", "含める", anySnoozed ? [["hide", "含めない"]] : [], 1);   // 保留中があるときだけ出す
  const cnt = document.getElementById("fcount");
  cnt.textContent = act ? `${total} 件中 ${visible} 件を表示` : "";
  cnt.hidden = !act;
  document.getElementById("fclear").hidden = !act;
}
function applyFilter() {
  syncUrl();
  instantRender = true;
  try { render(); } catch (e) { console.error(e); } finally { instantRender = false; }
}
fq.addEventListener("input", () => { flt.q = fq.value; applyFilter(); });
for (const [id, field] of [["fproject", "project"], ["fkind", "kind"], ["fprio", "prio"], ["flabel", "label"], ["fsnoozed", "snoozed"]])
  document.getElementById(id).addEventListener("change", e => { flt[field] = e.target.value; applyFilter(); });
document.getElementById("fclear").addEventListener("click", () => {
  for (const k of FILTER_KEYS) flt[k] = "";
  fq.value = "";
  applyFilter();
});
filterBox.addEventListener("submit", e => e.preventDefault());   // 検索欄で Enter を押しても、ページを読み直さない

// 読めなかったプロジェクトのバナーの文 (全体の表示では、頭にプロジェクトの名前を付ける)
const bannerText = p => `読めませんでした (${p.okAt ? `最後に読めたのは ${hhmm(p.okAt)}。` : ""}自動で読み直します): ${p.error}`;

function render() {
  if (!lastData) return false;
  const main = document.getElementById("main");
  const active = document.activeElement;
  const flat = view === "prio";
  const seenKeys = new Set();
  const entering = [];
  const projEls = [];
  const chips = [];                  // 目次の帯に並べるチップ (プロジェクトの順。全体の表示では出さない)
  const busyPaths = new Set();
  const hiddenKeys = new Set();      // 絞り込みで隠しているカード (畳まずに外す。失敗の表示は残す)
  const flatQ = [], flatA = [], flatBad = [];   // 全体の表示: 判断待ち・回答済み (プロジェクトの順) と、バナーを出すプロジェクト
  const allS = [];                   // 保留中 (どちらの表示でも、ページの下の 1 つの畳んだ節に出す)
  let total = 0, visible = 0, idle = 0, stale = 0, anyItems = false, shownProjects = 0;

  const ensureCard = (it, kind) => {
    const key = (kind === "ans" ? aKey : kind === "snz" ? sKey : qKey)(it.project, it.id);
    seenKeys.add(key);
    let c = cards.get(key);
    if (c && c.el._leave) unleave(c.el);
    let rebuild = false;
    if (c && c.sig !== it._sig) {
      if (c.el.contains(active)) stale++;      // 入力中のカードは、離れるまで作り直さない
      else rebuild = true;
    }
    if (!c || rebuild) {
      const fresh = !c;
      c = { el: kind === "ans" ? buildAnswered(it) : kind === "snz" ? buildSnoozed(it) : buildQuestion(it), sig: it._sig };
      cards.set(key, c);
      if (fresh && rendered) entering.push(c.el);
    }
    syncError(c, key);
    return c.el;
  };

  // 1. 今のデータから、どの入れ物にどのカードを並べるかを決める (DOM はまだ動かさない)
  const plan = [];
  for (const p of lastData.projects) {
    const q0 = p.human.filter(i => !pending.has(qKey(p.path, i.id)));
    const a0 = p.answered.filter(i => !pending.has(aKey(p.path, i.id)));
    const s0 = p.snoozed.filter(i => !pending.has(sKey(p.path, i.id)));
    total += q0.length;                // ヘッダーの件数は絞り込みに関係なく全件 (保留中は数えない)
    // 保留中は、判断待ちの無いプロジェクトのものも集める (節はプロジェクトの入れ物の外にある)
    for (const i of s0) { if (flt.snoozed !== "hide" && matchesFilter(i)) allS.push(i); else hiddenKeys.add(sKey(p.path, i.id)); }
    if (!q0.length && !a0.length && p.ok) { idle++; continue; }
    if (q0.length || a0.length) anyItems = true;
    const q = q0.filter(matchesFilter), a = a0.filter(matchesFilter);
    for (const i of q0) if (!q.includes(i)) hiddenKeys.add(qKey(p.path, i.id));
    for (const i of a0) if (!a.includes(i)) hiddenKeys.add(aKey(p.path, i.id));
    visible += q.length;
    // 絞り込みで中身が無くなったプロジェクトは出さない。読めなかったプロジェクトのバナーは、別のプロジェクトを選んでいるときだけ隠す
    if (!q.length && !a.length && (p.ok || (flt.project !== "" && flt.project !== p.path))) continue;
    if (q.length || a.length) shownProjects++;
    if (flat) {                        // カードは下で全体の並びにする。プロジェクトの入れ物は作らない
      flatQ.push(...q);
      flatA.push(...a);
      if (!p.ok) flatBad.push(p);
      continue;
    }
    busyPaths.add(p.path);
    let pr = projs.get(p.path);
    if (pr) { if (pr.el._leave) unleave(pr.el); }
    else {
      pr = { el: el("div", { class: "proj" }),
        h2: el("h2", { tabindex: "-1" }, el("span", { class: "pname" }, p.name), el("span", { class: "path", title: p.path }, p.path)),
        banner: null, chip: null, groups: new Map() };
      projs.set(p.path, pr);
    }
    // チップは判断待ちか回答済みがあるプロジェクトだけ (読めなかったプロジェクトのバナーだけの入れ物には出さない)
    if (q.length || a.length) chips.push(syncChip(pr, p, q));
    pr.banner = p.ok ? null : (pr.banner || el("div", { class: "banner" }));
    if (pr.banner) pr.banner.textContent = bannerText(p);
    const lists = {
      dec: q.filter(i => !i.q || i.q.kind !== "task"),
      task: q.filter(i => i.q && i.q.kind === "task"),
      ans: a,
    };
    const groups = [];
    for (const kind of ["dec", "task", "ans"]) {
      if (!lists[kind].length) continue;
      let g = pr.groups.get(kind);
      if (g) { if (g.el._leave) unleave(g.el); }
      else { g = makeGroup(kind, "h3", "", p.path); pr.groups.set(kind, g); }
      if (kind === "ans") syncAnsHead(g, TITLES[kind], lists[kind]);
      else g.h3.textContent = `${TITLES[kind]} (${lists[kind].length})`;
      groups.push({ kind, g, els: [g.top, ...lists[kind].map(i => ensureCard(i, kind))] });
    }
    plan.push({ pr, groups });
  }
  // 全体の表示: 判断待ち (判断と作業・確認) と回答済みを、それぞれ全プロジェクトを通して優先度 → 作成日の順に 1 列にする
  let flatPlan = null;
  if (flat && (flatQ.length || flatA.length || flatBad.length)) {
    const fb = flatBox || (flatBox = { el: el("div", { class: "flat" }), groups: new Map(), banners: new Map() });
    if (fb.el._leave) unleave(fb.el);
    const lists = { wait: flatQ.sort(byPrio), ans: flatA.sort(byPrio) };
    const groups = [];
    for (const kind of ["wait", "ans"]) {
      if (!lists[kind].length) continue;
      let g = fb.groups.get(kind);
      if (g) { if (g.el._leave) unleave(g.el); }
      else { g = makeGroup(kind, "h2", "sec", FLAT_ANS_KEY); fb.groups.set(kind, g); }
      if (kind === "ans") syncAnsHead(g, FLAT_TITLES[kind], lists[kind]);
      else g.h3.textContent = `${FLAT_TITLES[kind]} (${lists[kind].length})`;
      groups.push({ kind, g, els: [g.top, ...lists[kind].map(i => ensureCard(i, kind))] });
    }
    const banners = flatBad.map(p => {
      let b = fb.banners.get(p.path);
      if (!b) { b = el("div", { class: "banner", title: p.path }); fb.banners.set(p.path, b); }
      b.textContent = `${p.name}: ${bannerText(p)}`;
      return b;
    });
    for (const path of [...fb.banners.keys()]) if (!flatBad.some(p => p.path === path)) fb.banners.delete(path);
    flatPlan = { fb, groups, banners };
  }
  // 保留中の節: 戻る日の早いもの (期限なしは最後) → 優先度 → 作成日。開いたかどうかは入れ物 (details) が持つ (作り直さない)
  let snzEls = null;
  if (allS.length) {
    const sb = snzBox || (snzBox = makeSnzBox());
    if (sb.el._leave) unleave(sb.el);
    syncSnzHead(sb, allS);
    snzEls = [sb.sum, ...allS.sort(bySnooze).map(i => ensureCard(i, "snz"))];
  }

  // 2. データに無い (送信中・サーバー側の理由で消えた) カードは畳む。畳んでいるカードには触らない。
  //    place が外してしまわないよう、並べる前に済ませる
  for (const [key, c] of cards) {
    if (seenKeys.has(key) || c.el._leave) continue;
    if (hiddenKeys.has(key) && instantRender) { c.el.remove(); cards.delete(key); continue; }   // 絞り込みを変えた: 畳む動きは付けない
    leave(c.el, () => { if (cards.get(key) === c) cards.delete(key); });
  }
  for (const k of [...errors.keys()]) if (!seenKeys.has(k) && !pending.has(k) && !hiddenKeys.has(k)) errors.delete(k);

  // 3. 並べる。空になった節・プロジェクトは、中のカードが畳み終わってから外す
  for (const { pr, groups } of plan) {
    for (const { g, els } of groups) place(g.el, els);
    const live = new Set(groups.map(x => x.kind));
    for (const [kind, g] of pr.groups) if (!live.has(kind)) retire(g.el, () => { if (pr.groups.get(kind) === g) pr.groups.delete(kind); });
    place(pr.el, [pr.h2, pr.banner, ...groups.map(x => x.g.el)]);
    projEls.push(pr.el);
  }
  if (flatPlan) {
    const { fb, groups, banners } = flatPlan;
    for (const { g, els } of groups) place(g.el, els);
    const live = new Set(groups.map(x => x.kind));
    for (const [kind, g] of fb.groups) if (!live.has(kind)) retire(g.el, () => { if (fb.groups.get(kind) === g) fb.groups.delete(kind); });
    place(fb.el, [...banners, ...groups.map(x => x.g.el)]);
    projEls.push(fb.el);
  }
  // 出さない入れ物を外す (表示を切り替えた直後は、カードはもう新しい入れ物へ移っている)
  for (const [path, pr] of projs) {
    if (!busyPaths.has(path)) retire(pr.el, () => { if (projs.get(path) === pr) projs.delete(path); });
  }
  if (flatBox && !flatPlan) { const fb = flatBox; retire(fb.el, () => { if (flatBox === fb) flatBox = null; }); }
  if (snzEls) place(snzBox.el, snzEls);
  else if (snzBox) { const sb = snzBox; retire(sb.el, () => { if (snzBox === sb) snzBox = null; }); }

  emptyNote = emptyNote || el("p", { class: "empty" });
  idleNote = idleNote || el("p", { class: "empty" });
  emptyNote.textContent = filterActive() && anyItems ? "絞り込みに合うものはありません (解除すると全件に戻ります)" : `判断待ちはありません (登録 ${lastData.projects.length} プロジェクト)`;
  idleNote.textContent = `ほか ${idle} プロジェクトは判断待ちなし`;
  const busy = projEls.length > 0;
  place(main, [busy ? null : emptyNote, ...projEls, busy && idle && !filterActive() ? idleNote : null, snzEls ? snzBox.el : null]);
  syncFilterBar(total, visible);
  // 目次の帯: 判断待ち・回答済みが無くなった (送信中を除いて)・データから消えたプロジェクトのチップは、見出しを畳み終わるのを待たずに外す。
  // 帯 (並びの切り替え) は、判断待ちか回答済みを出しているプロジェクトがあれば、どちらの表示でも出す
  place(document.getElementById("tocin"), chips);
  document.getElementById("toc").hidden = !shownProjects;

  // 新しく現れたカード (追加・失敗からの戻り・取り消し) だけ入場させる。最初の描画では動かさない
  if (!instantRender) for (const e of entering) enter(e);
  if (active && active !== document.body && active.isConnected && document.activeElement === document.body) active.focus({ preventScroll: true });
  document.getElementById("count").textContent = `${total} 件`;
  document.getElementById("ovcount").textContent = `${total} 件`;   // 見通しの上部の件数も同じ数 (判断待ちだけを数える)
  document.title = total ? `(${total}) 判断待ち` : "判断待ち";
  staleCount = stale;
  rendered = true;
  return true;
}

// ---- 送信 ---------------------------------------------------------------------------------

// 押した瞬間に畳み、送信は裏で行う。成功したらデータの反映を待ち、失敗したら読み直してから戻すか決める
async function submit(key, it, path, body, onOk) {
  pending.set(key, { state: "inflight", path: it.project, seq: 0 });
  errors.delete(key);
  try { render(); } catch (e) { console.error(e); }   // カードを畳み、件数・見出し・空の文言を数え直す。描けなくても送信は進める
  let res;
  try {
    res = await api(path, body);
  } catch (e) {
    await failed(key, it, e, OP_OF[path]);
    return;
  }
  pending.set(key, { state: "done", path: it.project, seq: loadSeq });
  // 畳んだ古い要素は使い回さない: 畳み終わる前に問い直されても、下書きの外れた (表示だけ前の選択が残る) 要素が戻らない
  cards.delete(key);
  if (onOk) onOk(res);                      // 成功の応答 (回答なら asig を持つ)
  load();
}

function restore(key, info) {
  pending.delete(key);
  errors.set(key, info);
  render();
  const c = cards.get(key);
  if (c) flash(c.el);
}

// 入力中で作り直しを後回しにしているカードが見せている問いが、今のデータの問いと違うか。
// 違えば、その問いの選択肢への回答は、見ていない意味で記録されかねない (サーバーも qsig で同じ検査をする)
function questionChanged(it) {
  const p = lastData && lastData.projects.find(x => x.path === it.project);
  const cur = p && p.human.find(i => i.id === it.id);
  return !!cur && cur.qsig !== it.qsig;
}

// 問いが変わっていた。選んだ選択肢は消し (補足は残し)、今のデータでカードを作り直して、見直してもらう
function reviewChanged(key, it) {
  const d = drafts.get(dkOf(it));
  if (d) d.option = "";
  saveDrafts();
  cards.delete(key);
  errors.set(key, explain({ code: "changed" }));
  render();
  const c = cards.get(key);
  if (c) { flash(c.el); c.el.focus({ preventScroll: true }); }   // 押したボタンのある古いカードは外れたので、フォーカスを新しいカードへ
  toast(`「${summarize(it.title, 24)}」(${it.id}): ${CHANGED_MSG}`);
}

// 失敗の後に読み直したら、チケットが出どころの一覧にもう無かったときの知らせ。op は送信の種類 (出どころと行き先は OPS)
function missingNote(e, op, proj, it) {
  const o = opInfo(op);
  const src = o.srcName, dst = o.dstName;
  if (e.written === true)                                  // サーバーが「記録した」と言っている
    return e.stage === "label"
      ? `${o.what}は記録済みです (ラベルの付け替えだけ失敗)。${dst}の一覧を確認してください`
      : "送信の応答は失敗でしたが、反映されていました";
  if (e.written === false || (e.status >= 400 && e.status < 500))   // 書く前に断られた
    return `書き込めませんでした。チケットはもう${src}にありません`;
  // 書けたか分からない (通信が切れた・サーバーの内部エラー): 行き先に居るなら書けている
  const landed = proj[o.dst].some(i => i.id === it.id);
  return landed ? "送信の応答は失敗でしたが、反映されていました"
    : `書けたかどうか分かりません。チケットは今は${src}にありません。${dst}の一覧を確認してください`;
}

// op は送信の種類 (answer | undo | snooze | unsnooze)。省略は key の頭 (q は回答、a は取り消し) から決める
async function failed(key, it, e, op) {
  op = op || (key[0] === "a" ? "undo" : key[0] === "s" ? "unsnooze" : "answer");
  const snz = op === "snooze" || op === "unsnooze";
  const info = explain(e);
  const label = `「${summarize(it.title, 24)}」(${it.id})`;
  if (e.status === 403 && e.message === "token") {      // サーバーが入れ替わった (書き込みは何も起きていない)。下書きは再読み込みの後も使う
    restore(key, info);
    showNotice("画面のサーバーが入れ替わりました。ページを再読み込みしてください (入力した内容は残ります)", "再読み込み", () => location.reload(), "token");
    return;
  }
  // gone: ほかで回答・反映済み。stale: 取り消そうとした回答は、ほかで取り消して答え直されていた (409。何も書いていない)。
  // どちらも戻さず、読み直して今の状態を出す (stale なら、回答済みのカードが今の回答で出直す)
  if (e.code === "gone" || e.code === "stale") {
    pending.set(key, { state: "done", path: it.project, seq: loadSeq });
    if (key[0] === "q") dropDraft(it);                  // 回答・保留の gone だけ。取り消しの gone で、問い直された新しい問いの下書きを消さない
    // 前の知らせの「取り消す」「解除」は、ほかで反映された今の状態に合わない
    if (snz) dropToasts("snz", it); else dropAnsweredToasts(it);
    cards.delete(key);
    toast(`${label}: ${e.code === "stale" ? STALE_MSG : snz ? "もう判断待ちにありませんでした (ほかで回答・反映済み)" : "ほかで回答・反映済みでした"}`);
    load();
    return;
  }
  const changed = e.code === "changed";                  // 見ていた問いが書き換わっていた (書き込みは何も起きていない)
  if (changed) {
    const d = drafts.get(dkOf(it));
    if (d) d.option = "";                                // 選んだ選択肢は消す (補足は残す)
    saveDrafts();
    cards.delete(key);                                   // 読み直した今の問いで作り直す
  }
  const fresh = await load();                            // 先に今の状態を読む (書き込みが済んでいたら戻さない)
  const proj = lastData && lastData.projects.find(p => p.path === it.project);
  const present = !!proj && proj[opInfo(op).src].some(i => i.id === it.id);
