  if (!fresh || !proj || !proj.ok || present) {
    restore(key, info);
    toast(`${label}: ${changed ? info.summary : info.summary + "。カードを戻しました"}`);
    return;
  }
  // 取り消し・保留の解除の失敗では、問い直された新しい問いの下書きを消さない。保留の失敗で判断待ちから消えていたら、
  // 保留中か回答済みに居る (下書きは判断待ちに戻ったときに使う) ので消さない
  if (op === "answer") dropDraft(it);
  cards.delete(key);
  pending.delete(key);
  render();
  toast(`${label}: ${missingNote(e, op, proj, it)}`);
}

// ---- タブ (判断待ち / 見通し) と見通し ----------------------------------------------------------------
// 既定で開くのは判断待ち (ページを開くたび。選んだタブは覚えない)。見通しは読むだけ: タブを開いたときだけ /api/overview を読み
// (15 秒ごとの読み込みは /api/items だけ)、書き込みの部品もボタンも置かない (移るのはリンク)。見通しのデータは、ヘッダーの件数・
// タブのタイトル・通知に入れない (上部の件数は判断待ちの件数で、render が書く)

let tab = "human";
const TABS = ["human", "overview"];
const tabBtns = { human: document.getElementById("tab-human"), overview: document.getElementById("tab-overview") };
const panels = { human: document.getElementById("panel-human"), overview: document.getElementById("panel-overview") };
function showTab(name, focus) {
  const opened = name !== tab;
  tab = name;
  for (const k of TABS) {
    const on = k === name;
    tabBtns[k].setAttribute("aria-selected", String(on));
    tabBtns[k].tabIndex = on ? 0 : -1;
    panels[k].hidden = !on;
  }
  if (focus) tabBtns[name].focus();
  if (name === "overview" && opened) loadOverview();
}
for (const k of TABS) {
  tabBtns[k].addEventListener("click", () => showTab(k));
  // 矢印・Home・End でタブを移る (移った先を開く)
  tabBtns[k].addEventListener("keydown", e => {
    const i = TABS.indexOf(k);
    const to = e.key === "ArrowRight" ? TABS[(i + 1) % TABS.length] : e.key === "ArrowLeft" ? TABS[(i + TABS.length - 1) % TABS.length]
      : e.key === "Home" ? TABS[0] : e.key === "End" ? TABS[TABS.length - 1] : null;
    if (!to) return;
    e.preventDefault();
    showTab(to, true);
  });
}
document.getElementById("ovback").addEventListener("click", e => { e.preventDefault(); showTab("human", true); });

// 見通しの読み。開くたびに読む (サーバーは 60 秒の間は同じ読みを返す)。後から始めた読みがあれば、前の読みの結果は捨てる
const ovStatus = document.getElementById("ovstatus"), ovList = document.getElementById("ovlist");
let ovSeq = 0;
async function loadOverview() {
  const seq = ++ovSeq;
  ovStatus.textContent = "読み込み中…";
  let data;
  try {
    data = await api("/api/overview");
    if (!Array.isArray(data.projects)) throw new Error("想定外のデータ (projects が配列でない)");
  } catch (e) {
    if (seq === ovSeq) ovStatus.textContent = `見通しを読み込めませんでした: ${summarize(e.message)} (タブを開き直すと読み直します)`;
    return;
  }
  if (seq !== ovSeq) return;
  try {
    renderOverview(data.projects);
  } catch (e) {
    console.error(e);
    ovStatus.textContent = `見通しを描けませんでした: ${summarize(e.message)}`;
    return;
  }
  ovStatus.textContent = `${hhmm(Date.now())} に読みました (読むだけの一覧です。タブを開くたびに読み直し、60 秒以内は同じ内容です)`;
}

// 見通しの描き直し (入力の部品が無いので、毎回作り直す)。プロジェクトごとに、状態別の件数と、次に着手できるチケットの上位
function renderOverview(projects) {
  const boxes = projects.filter(p => p && typeof p.path === "string").map(p => {
    const name = typeof p.name === "string" && p.name ? p.name : p.path.split("/").pop();
    const h = el("h2", {}, el("span", { class: "pname" }, name), el("span", { class: "path", title: p.path }, p.path));
    if (p.ok !== true) return el("div", { class: "ovproj", "data-path": p.path }, h, el("div", { class: "banner" }, `読めませんでした: ${p.error || "理由が分からない"}`));
    const counts = (Array.isArray(p.counts) ? p.counts : []).filter(c => c && typeof c.status === "string" && typeof c.count === "number");
    const total = counts.reduce((n, c) => n + c.count, 0);
    const ready = (Array.isArray(p.ready) ? p.ready : []).filter(r => r && typeof r.id === "string");
    const all = typeof p.ready_total === "number" ? p.ready_total : ready.length;
    return el("div", { class: "ovproj", "data-path": p.path }, h,
      el("h3", {}, `状態別の件数 (計 ${total})`),
      counts.length ? el("ul", { class: "ovstat" }, counts.map(c => el("li", {}, el("span", { class: "ovs" }, c.status), " ", el("b", {}, String(c.count)))))
        : el("p", { class: "ovnone" }, "数えるチケットはありません"),
      el("h3", {}, all > ready.length ? `次に着手できる (${all} 件のうち上位 ${ready.length} 件)` : `次に着手できる (${all})`),
      ready.length ? el("ol", { class: "ovready" }, ready.map(r => readyRow(p.path, r))) : el("p", { class: "ovnone" }, "次に着手できるチケットはありません"));
  });
  ovList.replaceChildren(...(boxes.length ? boxes : [el("p", { class: "empty" }, "登録したプロジェクトはありません")]));
}

// 次に着手できるチケットの 1 行。human の付いたもの (判断待ち) は、題を判断待ちのカードへのリンクにする。ラベルは解釈せず、
// humanq 自身のもの (human / answered / snoozed) を除いて文字列のまま出す
function readyRow(path, r) {
  const p = typeof r.priority === "number" ? r.priority : 9;
  const labels = shownLabels(r);
  const title = typeof r.title === "string" && r.title ? r.title : r.id;
  const human = r.human === true;
  const t = human ? el("a", { class: "ovlink", href: "#", title: "判断待ちのカードを開く", onclick: e => { e.preventDefault(); openCard(path, r.id); } }, title)
    : el("span", {}, title);
  return el("li", { class: "ovrow", "data-id": r.id },
    el("div", { class: "head" },
      el("span", { class: `prio p${p}` }, `P${p}`),
      el("span", { class: "ovid" }, r.id),
      typeof r.status === "string" && r.status ? el("span", {}, r.status) : null,
      human ? el("span", { class: "ovhuman" }, "判断待ち") : null,
      ...labels.slice(0, MAX_LABELS).map(l => el("span", {}, l)),
      labels.length > MAX_LABELS ? el("span", { title: labels.join("\n") }, `+${labels.length - MAX_LABELS}`) : null),
    el("p", { class: "ovt" }, t));
}

// 判断待ちのタブへ移り、そのチケットのカード (判断待ちか保留中) へ飛ぶ。畳んだ節の中なら開き、絞り込みで隠れていれば絞り込みを
// 解いてから飛ぶ。カードが無ければ (判断待ちから外れた・まだ読み込んでいない) 知らせて読み直す
const liveCard = (path, id) => {
  for (const key of [qKey(path, id), sKey(path, id)]) {
    const c = cards.get(key);
    if (c && c.el.isConnected && !c.el._leave) return c.el;
  }
  return null;
};
function openCard(path, id) {
  showTab("human");
  let c = liveCard(path, id);
  if (!c && filterActive()) {
    for (const k of FILTER_KEYS) flt[k] = "";
    fq.value = "";
    applyFilter();
    c = liveCard(path, id);
  }
  if (!c) {
    toast(`「${id}」は判断待ちに見つかりませんでした (読み直します)`);
    load();
    return;
  }
  const d = c.closest("details:not([open])");
  if (d) d.open = true;
  c.focus({ preventScroll: true });
  c.scrollIntoView({ block: "start", behavior: REDUCED ? "auto" : "smooth" });
}

// ---- 読み込み -------------------------------------------------------------------------------

function notifyNew(projects) {
  const keyOf = (p, i) => p.path + "\n" + i.id;
  const ids = projects.flatMap(p => p.human.map(i => keyOf(p, i)));
  // 前の読みで保留中だったものが、保留の情報なし (snooze: null) で判断待ちに出たのは、戻る日を読めなかった読み (サーバーの
  // 入れ替え直後の読み残しなど)。増えたとは数えない (戻る日が来た・問いが書き換わったものは snooze が付くので数える)
  const quiet = new Set(projects.flatMap(p => p.human.filter(i => !i.snooze && prevSnz.has(keyOf(p, i))).map(i => keyOf(p, i))));
  prevSnz = new Set(projects.flatMap(p => (p.snoozed || []).map(i => keyOf(p, i))));
  if (seen === null) { seen = new Set(ids); return; }
  const fresh = ids.filter(i => !seen.has(i) && !quiet.has(i));
  seen = new Set(ids);
  if (fresh.length && "Notification" in window && Notification.permission === "granted")
    new Notification("判断待ちが増えました", { body: `${fresh.length} 件` });
}

// 受け取ったデータの形を確かめ、書き換えずに project と署名を足した新しいデータを返す。
// 読めなかったプロジェクト (ok:false) は、前に読めたときのカードを残す (空に見せて入れ替えない)
function normalize(raw, prev) {
  if (!raw || !Array.isArray(raw.projects)) throw new Error("想定外のデータ (projects が配列でない)");
  // サーバーの今日。カードの署名 (残りの日数) を数える前に入れる。形が崩れていれば (古いサーバーは返さない) ブラウザの日付
  serverToday = validDay(raw.today) ? raw.today : null;
  const projects = raw.projects.map(p => {
    if (!p || typeof p.path !== "string" || !Array.isArray(p.human) || !Array.isArray(p.answered)) throw new Error("想定外のデータ (プロジェクトの形)");
    // 保留中 (snoozed) を返さない (古い) サーバーは、保留中が無い。返すなら配列でなければならない
    if (p.snoozed !== undefined && p.snoozed !== null && !Array.isArray(p.snoozed)) throw new Error("想定外のデータ (プロジェクトの形)");
    const old = prev && prev.projects.find(x => x.path === p.path);
    // writable を返さない (古い) サーバーは、どのプロジェクトにも書き込める
    const writable = p.writable !== false, cli = typeof p.cli === "string" ? p.cli : null;
    const name = p.name || p.path.split("/").pop();
    const conv = sig => i => {
      if (!i || typeof i.id !== "string" || (i.q != null && (typeof i.q !== "object" || !Array.isArray(i.q.options)))) throw new Error("想定外のデータ (チケットの形)");
      const x = { ...i, project: p.path, pname: name, writable, cli };
      x._sig = sig(x);
      return x;
    };
    const keep = !p.ok && old;
    return { path: p.path, name, ok: !!p.ok, error: p.error,
      okAt: p.ok ? Date.now() : (old && old.okAt) || null,         // このプロジェクトを最後に読めた時刻 (一度も読めていなければ null)
      human: keep ? old.human : p.human.map(conv(sigQ)), answered: keep ? old.answered : p.answered.map(conv(sigA)),
      snoozed: keep ? old.snoozed : (p.snoozed || []).map(conv(sigS)) };
  });
  return { projects };
}

// 成功した送信の印を外す: その後に始めた読み込みのデータが、読めたプロジェクトについて届いたとき
function settlePending(data, seq) {
  for (const [key, st] of [...pending]) {
    if (st.state !== "done" || seq <= st.seq) continue;
    const p = data.projects.find(x => x.path === st.path);
    if (!p || p.ok) pending.delete(key);
  }
}

async function runLoad() {
  const seq = ++loadSeq;
  const meta = document.getElementById("meta");
  let data;
  try {
    data = normalize(await api("/api/items"), lastData);
  } catch (e) {
    toast(`読み込めませんでした: ${summarize(e.message)}`);
    // 2 回続けて読めなかったら、データが古いことを知らせる (1 回だけなら、トーストだけ)
    if (++failStreak >= 2) {
      if (!meta.textContent.endsWith(STALE_MARK)) meta.textContent += STALE_MARK;
      if (noticeKind !== "offline")
        showNotice(`画面のサーバーに届きません。${lastOkAt ? `最後に読めたのは ${hhmm(lastOkAt)} です。` : ""}自動で読み直しています`,
          "今すぐ読み直す", () => { load(); }, "offline");
    }
    return false;
  }
  failStreak = 0;
  lastOkAt = Date.now();
  hideNotice("offline");
  lastData = data;
  settlePending(data, seq);
  notifyNew(data.projects);
  try {
    render();
    meta.textContent = "更新 " + new Date().toLocaleTimeString() + (staleCount ? " (入力中のカードの更新は後回し)" : "");
  } catch (e) {
    console.error(e);
    toast(`画面を描けませんでした: ${summarize(e.message)}`);
    return false;
  }
  return true;
}

// 実行中なら捨てずに予約する (予約した読み込みは今の読み込みが終わってから新しく始まるので、成功の後のデータを読める)。
// 返り値は、その読み込みが終わったとき true (読めたか) になる Promise
let running = null, queued = null;
function load() {
  if (!running) {
    running = runLoad().finally(() => { running = null; });
    return running;
  }
  if (!queued) queued = running.then(() => { queued = null; return load(); });
  return queued;
}

// ポインター (マウス・タッチ・ペン) を押している間は、focusout からの描き直しを始めない。
// 後回しにしていたカードを作り直すと高さが変わり、その下のカードが押している最中に動いて、離したところにボタンが無くなる (click が消える)。
// 離したあとに setTimeout 0 で描き直す: click は pointerup と同じ処理の中で届くので、その後になる
let pointerDown = false, renderAfterPointer = false;
const pointerUp = () => {
  pointerDown = false;
  if (renderAfterPointer) { renderAfterPointer = false; setTimeout(render, 0); }
};
// 主ボタン・タッチ・ペンだけ数える (右クリックのメニューが開くと pointerup が来ないことがある)。ウィンドウを離れたときも解く
document.addEventListener("pointerdown", e => { if (e.button === 0) pointerDown = true; }, true);
document.addEventListener("pointerup", pointerUp, true);
document.addEventListener("pointercancel", pointerUp, true);
window.addEventListener("blur", pointerUp);

// 入力欄などのカードの中から外へフォーカスが移ったら、後回しにしていたカードを作り直す。
// 移り先が無い (null) ときは待つ: ボタンを押している最中かもしれず、次の読み込みで直る
document.addEventListener("focusout", e => {
  if (!staleCount) return;
  const to = e.relatedTarget;
  const card = e.target.closest && e.target.closest(".card");
  if (!card || !to || card.contains(to)) return;
  if (pointerDown) { renderAfterPointer = true; return; }
  setTimeout(render, 0);
});
// トーストの高さ (と下の隙間) を CSS の --toast-space に渡す。幅の狭い画面では、その分だけページの下に余白を足す (CSS の @media)
const toastBox = document.getElementById("toasts");
if ("ResizeObserver" in window)
  new ResizeObserver(() => document.documentElement.style.setProperty("--toast-space", toastBox.offsetHeight ? toastBox.offsetHeight + 8 + "px" : "0px"))
    .observe(toastBox);
// sticky のヘッダーの高さを CSS の --head-h に渡す (プロジェクトの見出しが止まる位置と、飛ぶ先・カードの scroll-margin-top)。
// 高さは固定でない: 幅が狭いと「(古いデータ)」などでヘッダーの行が折り返す
const headerBox = document.querySelector("header");
const syncHead = () => document.documentElement.style.setProperty("--head-h", headerBox.getBoundingClientRect().height + "px");
syncHead();                        // ResizeObserver の無いブラウザでも最初の高さは渡す (ある場合は observe も最初に 1 回呼ぶ)
if ("ResizeObserver" in window) new ResizeObserver(syncHead).observe(headerBox);
const nb = document.getElementById("notify");
if (!("Notification" in window) || Notification.permission === "granted") nb.hidden = true;
nb.addEventListener("click", async () => { if (await Notification.requestPermission() === "granted") nb.hidden = true; });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(load, POLL_MS);       // 裏のタブでも回す (増えたときの通知のため)
load();
</script>
</body>
</html>
